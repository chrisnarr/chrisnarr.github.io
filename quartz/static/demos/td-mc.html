<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TD vs MC Gridworld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&family=IBM+Plex+Mono&display=swap"
    />
    <style>
      :root {
        --light: #ffffff;
        --lightgray: #e5e5e5;
        --gray: #b8b8b8;
        --darkgray: #4e4e4e;
        --dark: #2b2b2b;
        --secondary: #0065bd;
        --tertiary: #64a0c8;
        --danger: #d1495b;
        --mc: #8e5cc4;
        --goal: #2e9e5b;
        --flash: #f0a020;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --light: #161618;
          --lightgray: #393639;
          --gray: #646464;
          --darkgray: #d4d4d4;
          --dark: #ebebec;
          --secondary: #64a0c8;
          --tertiary: #0065bd;
          --danger: #e07a87;
          --mc: #b48ee0;
          --goal: #5cc28a;
          --flash: #f5b942;
        }
      }
      :root[data-theme="dark"] {
        --light: #161618;
        --lightgray: #393639;
        --gray: #646464;
        --darkgray: #d4d4d4;
        --dark: #ebebec;
        --secondary: #64a0c8;
        --tertiary: #0065bd;
        --danger: #e07a87;
        --mc: #b48ee0;
        --goal: #5cc28a;
        --flash: #f5b942;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--light);
        color: var(--darkgray);
        font-family: "Source Sans Pro", system-ui, sans-serif;
        font-size: 15px;
      }
      #wrap {
        padding: 2px;
      }
      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 10px 12px;
      }
      .panel {
        margin: 0;
        min-width: 0;
      }
      .panel figcaption {
        display: flex;
        align-items: baseline;
        gap: 7px;
        font-size: 14px;
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 4px;
      }
      .panel figcaption .name {
        white-space: nowrap;
      }
      .panel figcaption .sub {
        font-weight: 400;
        font-size: 13px;
        color: var(--darkgray);
      }
      .stage {
        position: relative;
        border: 1px solid var(--lightgray);
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
      }
      .stage canvas {
        cursor: crosshair;
      }
      .status {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.5;
        margin-top: 4px;
        color: var(--darkgray);
        height: 4.5em;
      }
      .status div,
      #readout div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status b {
        font-weight: 400;
        color: var(--dark);
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        align-self: center;
      }
      .dot.mc {
        background: var(--mc);
      }
      .dot.td {
        background: var(--secondary);
      }
      #readout {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--darkgray);
        margin: 6px 0 0;
        line-height: 1.5;
        height: 3em;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 10px 0 6px;
      }
      .bar .lbl {
        font-size: 14px;
        margin-right: 2px;
      }
      .bar .sep {
        width: 10px;
      }
      button {
        font: inherit;
        font-size: 14px;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid var(--lightgray);
        background: var(--light);
        color: var(--dark);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      button:hover {
        border-color: var(--secondary);
        color: var(--secondary);
      }
      button.primary {
        background: var(--secondary);
        border-color: var(--secondary);
        color: var(--light);
      }
      button[aria-pressed="true"] {
        background: var(--tertiary);
        border-color: var(--tertiary);
        color: var(--light);
      }
      button.primary:hover,
      button[aria-pressed="true"]:hover {
        color: var(--light);
        opacity: 0.9;
      }
      .sw {
        display: inline-block;
        width: 13px;
        height: 13px;
        border-radius: 3px;
        border: 1px solid var(--gray);
        flex: none;
      }
      .sw-wall {
        background: var(--dark);
        border-color: var(--dark);
      }
      .sw-lava {
        background: color-mix(in srgb, var(--danger) 60%, transparent);
        border-color: var(--danger);
      }
      .sw-goal {
        background: color-mix(in srgb, var(--goal) 35%, transparent);
        border-color: var(--goal);
      }
      .sw-start {
        font-size: 10px;
        line-height: 11px;
        text-align: center;
        font-weight: 600;
      }
      .sw-erase {
        background: var(--light);
      }
      .plots {
        margin-top: 4px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 8px 12px;
      }
      .plot {
        min-width: 0;
        margin: 0;
        border: 1px solid var(--lightgray);
        border-radius: 8px;
        padding: 6px 8px 4px;
      }
      .plot figcaption {
        font-size: 13px;
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 2px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
      }
      .plot figcaption .key {
        font-weight: 400;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .plot canvas {
        height: 160px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 4px 20px;
      }
      label.slider {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        font-size: 14px;
        gap: 0 8px;
      }
      label.slider span.val {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--dark);
      }
      label.slider input {
        grid-column: 1 / 3;
        width: 100%;
        accent-color: var(--secondary);
        margin: 2px 0 6px;
      }
      .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        font-size: 14px;
        margin-top: 2px;
      }
      .toggles input {
        accent-color: var(--secondary);
      }
      @media (max-width: 520px) {
        .status,
        #readout {
          font-size: 11px;
        }
        button {
          font-size: 13px;
          padding: 4px 9px;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div class="panels">
        <figure class="panel">
          <figcaption>
            <i class="dot mc"></i><span class="name">Monte Carlo</span>
            <span class="sub">updates once the episode is over</span>
          </figcaption>
          <div class="stage">
            <canvas id="cvMC" role="img" aria-label="Monte Carlo agent gridworld"></canvas>
          </div>
          <div class="status" id="stMC"></div>
        </figure>
        <figure class="panel">
          <figcaption>
            <i class="dot td"></i><span class="name" id="tdName">TD: SARSA</span>
            <span class="sub">updates after every step</span>
          </figcaption>
          <div class="stage">
            <canvas id="cvTD" role="img" aria-label="TD agent gridworld"></canvas>
          </div>
          <div class="status" id="stTD"></div>
        </figure>
      </div>
      <div id="readout"></div>

      <div class="bar" id="tools">
        <span class="lbl">Paint:</span>
        <button data-tool="wall" aria-pressed="true"><i class="sw sw-wall"></i>Wall</button>
        <button data-tool="lava" aria-pressed="false"><i class="sw sw-lava"></i>Lava</button>
        <button data-tool="goal" aria-pressed="false"><i class="sw sw-goal"></i>Goal</button>
        <button data-tool="start" aria-pressed="false"><i class="sw sw-start">S</i>Start</button>
        <button data-tool="erase" aria-pressed="false"><i class="sw sw-erase"></i>Erase</button>
      </div>

      <div class="plots">
        <figure class="plot">
          <figcaption>
            Return per episode
            <span class="key"><i class="dot mc"></i>MC</span>
            <span class="key"><i class="dot td"></i>TD</span>
          </figcaption>
          <canvas
            id="pRet"
            role="img"
            aria-label="Return per episode over environment steps for both agents"
          ></canvas>
        </figure>
        <figure class="plot">
          <figcaption>
            Greedy success [%]
            <span class="key"><i class="dot mc"></i>MC</span>
            <span class="key"><i class="dot td"></i>TD</span>
          </figcaption>
          <canvas
            id="pSucc"
            role="img"
            aria-label="Share of greedy rollouts from the start cell that reach the goal"
          ></canvas>
        </figure>
        <figure class="plot">
          <figcaption>
            <span>RMS error to V*</span>
            <span class="key"><i class="dot mc"></i>MC</span>
            <span class="key"><i class="dot td"></i>TD</span>
          </figcaption>
          <canvas
            id="pErr"
            role="img"
            aria-label="Value error to the optimal value function over environment steps"
          ></canvas>
        </figure>
      </div>

      <div class="bar">
        <button id="play" class="primary">Pause</button>
        <button id="step">Step</button>
        <button id="resetLearn">Reset learning</button>
        <button id="defaults">Default parameters</button>
      </div>
      <div class="bar">
        <span class="lbl">Map:</span>
        <button id="mapCliff">Cliff</button>
        <button id="randMap">Random</button>
        <button id="clearMap">Clear</button>
      </div>
      <div class="bar">
        <span class="lbl">TD method:</span>
        <button id="mSarsa" aria-pressed="true">SARSA</button>
        <button id="mQ" aria-pressed="false">Q-learning</button>
      </div>
      <div class="bar">
        <span class="lbl">Initial state:</span>
        <button id="stFixed" aria-pressed="true">S cell</button>
        <button id="stRandom" aria-pressed="false">random cell (exploring starts)</button>
      </div>

      <div class="grid">
        <label class="slider"
          >Learning rate α <span class="val" id="vA"></span>
          <input id="sA" type="range" min="0.01" max="1" step="0.01"
        /></label>
        <label class="slider"
          >Exploration ε <span class="val" id="vE"></span>
          <input id="sE" type="range" min="0" max="0.5" step="0.01"
        /></label>
        <label class="slider"
          >Discount γ <span class="val" id="vG"></span>
          <input id="sG" type="range" min="0.5" max="0.99" step="0.01"
        /></label>
        <label class="slider"
          >Slip probability <span class="val" id="vS"></span>
          <input id="sS" type="range" min="0" max="0.5" step="0.01"
        /></label>
        <label class="slider"
          >Speed <span class="val" id="vV"></span>
          <input id="sV" type="range" min="0" max="3.7" step="0.01"
        /></label>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="cValues" checked /> Show values</label>
        <label><input type="checkbox" id="cPolicy" checked /> Show greedy policy</label>
        <label><input type="checkbox" id="cFlash" checked /> Highlight updates</label>
        <label><input type="checkbox" id="cTrail" checked /> Show episode trail</label>
      </div>
    </div>

    <script>
      "use strict"

      // ---------------------------------------------------------------------
      // Gridworld
      // ---------------------------------------------------------------------
      const COLS = 12,
        ROWS = 7,
        N = COLS * ROWS
      const EMPTY = 0,
        WALL = 1,
        LAVA = 2,
        GOAL = 4
      const DIRS = [
        [0, -1],
        [1, 0],
        [0, 1],
        [-1, 0],
      ] // up, right, down, left (rows grow downwards)
      const R_STEP = -0.02,
        R_LAVA = -1,
        R_GOAL = 1
      const MAX_STEPS = 100 // episodes are truncated after this many steps

      const DEFAULTS = { alpha: 0.1, eps: 0.1, gamma: 0.95, slip: 0, speed: 2.3 }
      const P = { ...DEFAULTS }
      let tdMethod = "sarsa"
      const opt = { values: true, policy: true, flash: true, trail: true, randomStarts: false }

      const map = new Uint8Array(N)
      let start = 0
      const idx = (x, y) => y * COLS + x
      const cx = (s) => s % COLS
      const cy = (s) => (s / COLS) | 0

      // cliff walking (Sutton & Barto, Example 6.6): the top rows are walled off so that
      // the open area is the original 12 x 4 grid; the shortest path runs right along the lava
      function cliffMap() {
        map.fill(EMPTY)
        for (let y = 0; y < ROWS - 4; y++) for (let x = 0; x < COLS; x++) map[idx(x, y)] = WALL
        for (let x = 1; x <= 10; x++) map[idx(x, 6)] = LAVA
        map[idx(11, 6)] = GOAL
        start = idx(0, 6)
      }

      const isTerminal = (s) => map[s] === LAVA || map[s] === GOAL
      const isOpen = (s) => map[s] === EMPTY
      const slipAt = () => P.slip // the same randomness in every state
      const rewardOf = (s2) => (map[s2] === LAVA ? R_LAVA : map[s2] === GOAL ? R_GOAL : R_STEP)

      function randomOpenCell() {
        const open = []
        for (let s = 0; s < N; s++) if (map[s] === EMPTY) open.push(s)
        return open.length ? open[(Math.random() * open.length) | 0] : start
      }

      function move(s, a) {
        const x = cx(s) + DIRS[a][0],
          y = cy(s) + DIRS[a][1]
        if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return s
        const n = idx(x, y)
        return map[n] === WALL ? s : n
      }

      // with probability p the robot slips to one of the two perpendicular directions
      function envStep(s, a) {
        let act = a
        const p = slipAt(s)
        if (p > 0 && Math.random() < p) act = (a + (Math.random() < 0.5 ? 1 : 3)) % 4
        const s2 = move(s, act)
        return { s2, r: rewardOf(s2), done: isTerminal(s2) }
      }

      // Optimal values by value iteration (the reference for the error plot and the color scale)
      const Vstar = new Float64Array(N)
      function backup(s, a) {
        const s2 = move(s, a)
        return rewardOf(s2) + (isTerminal(s2) ? 0 : P.gamma * Vstar[s2])
      }
      function computeVstar() {
        Vstar.fill(0)
        for (let it = 0; it < 5000; it++) {
          let delta = 0
          for (let s = 0; s < N; s++) {
            if (!isOpen(s)) continue
            const p = slipAt(s)
            let best = -Infinity
            for (let a = 0; a < 4; a++) {
              const q =
                (1 - p) * backup(s, a) +
                (p / 2) * (backup(s, (a + 1) % 4) + backup(s, (a + 3) % 4))
              if (q > best) best = q
            }
            delta = Math.max(delta, Math.abs(best - Vstar[s]))
            Vstar[s] = best
          }
          if (delta < 1e-7) break
        }
        vLo = Infinity
        vHi = -Infinity
        for (let s = 0; s < N; s++)
          if (isOpen(s)) {
            vLo = Math.min(vLo, Vstar[s])
            vHi = Math.max(vHi, Vstar[s])
          }
        if (!(vHi - vLo > 1e-6)) {
          vLo = (isFinite(vHi) ? vHi : 0) - 1
          vHi = vLo + 1
        }
      }
      let vLo = -1,
        vHi = 0

      // ---------------------------------------------------------------------
      // Agents
      // ---------------------------------------------------------------------
      function makeSeries() {
        return { pts: [], stride: 1, n: 0 }
      }
      // keep at most ~2000 points: when full, drop every other point and halve the sampling rate
      function wants(sr) {
        return sr.n % sr.stride === 0
      }
      function pushSeries(sr, p) {
        if (sr.n++ % sr.stride !== 0) return
        sr.pts.push(p)
        if (sr.pts.length > 2000) {
          sr.pts = sr.pts.filter((_, i) => i % 2 === 0)
          sr.stride *= 2
        }
      }

      class Agent {
        constructor(kind) {
          this.kind = kind // "mc" or "td"
          this.Q = new Float64Array(N * 4)
          this.visits = new Uint32Array(N)
          this.flash = new Float32Array(N)
          this.reset()
        }
        reset() {
          this.Q.fill(0)
          this.visits.fill(0)
          this.flash.fill(0)
          this.steps = 0
          this.episodes = 0
          this.ema = null
          this.ret = 0
          this.hist = makeSeries()
          this.err = makeSeries()
          this.succ = makeSeries()
          this.nextEval = 0
          this.outcomes = []
          this.lastReturn = null
          this.lastDelta = null
          this.lastUpdated = 0
          this.startEpisode()
        }
        startEpisode() {
          const s0 = opt.randomStarts ? randomOpenCell() : start
          this.s = s0
          this.prevS = s0
          this.t = 0
          this.ret = 0
          this.traj = []
          this.trail = [s0]
          this.pendingReset = false
          this.a = this.policy(s0)
        }
        maxQ(s) {
          const q = this.Q
          const k = s * 4
          return Math.max(q[k], q[k + 1], q[k + 2], q[k + 3])
        }
        greedy(s, randomTies) {
          const q = this.Q,
            k = s * 4
          let best = -Infinity,
            ties = []
          for (let a = 0; a < 4; a++) {
            if (q[k + a] > best + 1e-9) {
              best = q[k + a]
              ties = [a]
            } else if (q[k + a] > best - 1e-9) ties.push(a)
          }
          if (!randomTies) return ties.length === 4 ? -1 : ties[0]
          return ties[(Math.random() * ties.length) | 0]
        }
        policy(s) {
          if (Math.random() < P.eps) return (Math.random() * 4) | 0
          return this.greedy(s, true)
        }
        tick() {
          if (this.pendingReset) this.startEpisode()
          else this.step()
        }
        step() {
          const s = this.s
          const a = this.kind === "td" && tdMethod === "sarsa" ? this.a : this.policy(s)
          const { s2, r, done } = envStep(s, a)
          this.ret += r
          this.t++
          this.steps++
          if (this.kind === "td") {
            let target = r,
              a2 = null
            if (!done) {
              if (tdMethod === "sarsa") {
                a2 = this.policy(s2)
                target += P.gamma * this.Q[s2 * 4 + a2]
              } else target += P.gamma * this.maxQ(s2)
            }
            const k = s * 4 + a
            const delta = target - this.Q[k]
            this.Q[k] += P.alpha * delta
            this.visits[s]++
            this.flash[s] = 1
            this.lastDelta = delta
            this.a = a2
          } else {
            this.traj.push(s, a, r)
          }
          this.prevS = s
          this.s = s2
          this.trail.push(s2)
          if (done || this.t >= MAX_STEPS)
            this.endEpisode(done ? (map[s2] === GOAL ? "goal" : "lava") : "timeout")
        }
        endEpisode(outcome) {
          if (this.kind === "mc") {
            // every-visit, constant-α MC: walk the episode backwards accumulating the return
            let G = 0
            const tr = this.traj
            for (let i = tr.length - 3; i >= 0; i -= 3) {
              const s = tr[i],
                a = tr[i + 1],
                r = tr[i + 2]
              G = r + P.gamma * G
              const k = s * 4 + a
              this.Q[k] += P.alpha * (G - this.Q[k])
              this.visits[s]++
              this.flash[s] = 1
            }
            this.lastUpdated = tr.length / 3
            this.traj = []
          }
          this.episodes++
          this.lastReturn = this.ret
          this.lastOutcome = outcome
          this.outcomes.push(outcome === "goal")
          if (this.outcomes.length > 20) this.outcomes.shift()
          this.ema = this.ema === null ? this.ret : this.ema + 0.08 * (this.ret - this.ema)
          pushSeries(this.hist, { x: this.steps, y: this.ret, e: this.ema })
          this.pendingReset = true // sit on the terminal cell for one tick, then respawn
        }
        valueError() {
          let sum = 0,
            n = 0
          for (let s = 0; s < N; s++) {
            if (!isOpen(s)) continue
            const d = this.maxQ(s) - Vstar[s]
            sum += d * d
            n++
          }
          return n ? Math.sqrt(sum / n) : 0
        }
        // fraction of greedy rollouts (ties broken at random) that reach the goal from S
        greedySuccess() {
          let ok = 0
          const R = 20
          for (let k = 0; k < R; k++) {
            let s = start
            for (let t = 0; t < MAX_STEPS; t++) {
              const r = envStep(s, this.greedy(s, true))
              s = r.s2
              if (r.done) break
            }
            if (map[s] === GOAL) ok++
          }
          return (100 * ok) / R
        }
        recordError() {
          if (this.steps >= this.nextEval) {
            this.succ.pts.push({ x: this.steps, y: this.greedySuccess() })
            if (this.succ.pts.length > 1000) this.succ.pts = this.succ.pts.filter((_, i) => i % 2 === 0)
            this.nextEval = this.steps + Math.max(250, Math.round(this.steps / 400))
          }
          if (wants(this.err)) pushSeries(this.err, { x: this.steps, y: this.valueError() })
          else this.err.n++
        }
      }

      const mc = new Agent("mc")
      const td = new Agent("td")
      const agents = [mc, td]

      function tick() {
        for (const ag of agents) {
          const before = ag.steps
          ag.tick()
          if (ag.steps !== before) ag.recordError()
        }
      }

      function mapChanged() {
        computeVstar()
        for (const ag of agents) if (!ag.pendingReset && !isOpen(ag.s)) ag.startEpisode()
      }

      // ---------------------------------------------------------------------
      // Theme: follow the Quartz site colors when embedded
      // ---------------------------------------------------------------------
      const COLORS = {}
      function readColors() {
        let src = document.documentElement
        try {
          if (window.parent !== window && window.parent.document) {
            const pr = window.parent.document.documentElement
            const theme = pr.getAttribute("saved-theme")
            if (theme) document.documentElement.setAttribute("data-theme", theme)
            const pcs = getComputedStyle(pr)
            if (pcs.getPropertyValue("--secondary").trim()) src = pr
          }
        } catch (e) {
          /* cross-origin or standalone */
        }
        const cs = getComputedStyle(src)
        const own = getComputedStyle(document.documentElement)
        for (const n of [
          "light",
          "lightgray",
          "gray",
          "darkgray",
          "dark",
          "secondary",
          "tertiary",
        ]) {
          const v = cs.getPropertyValue("--" + n).trim() || own.getPropertyValue("--" + n).trim()
          COLORS[n] = v
          document.documentElement.style.setProperty("--" + n, v)
        }
        for (const n of ["danger", "mc", "goal", "flash"])
          COLORS[n] = own.getPropertyValue("--" + n).trim()
        draw()
      }

      function watchTheme() {
        try {
          if (window.parent !== window) {
            new MutationObserver(readColors).observe(window.parent.document.documentElement, {
              attributes: true,
              attributeFilter: ["saved-theme", "class", "style"],
            })
          }
        } catch (e) {}
        if (window.matchMedia)
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors)
      }

      const probeCtx = document.createElement("canvas").getContext("2d")
      function withAlpha(color, a) {
        const ctx = probeCtx
        ctx.fillStyle = "#000"
        ctx.fillStyle = color
        const c = ctx.fillStyle
        if (c[0] === "#") {
          const r = parseInt(c.slice(1, 3), 16),
            g = parseInt(c.slice(3, 5), 16),
            b = parseInt(c.slice(5, 7), 16)
          return `rgba(${r},${g},${b},${a})`
        }
        const m = c.match(/[\d.]+/g)
        return m ? `rgba(${m[0]},${m[1]},${m[2]},${a})` : color
      }

      // ---------------------------------------------------------------------
      // Grid rendering
      // ---------------------------------------------------------------------
      const panels = [
        { agent: mc, cv: document.getElementById("cvMC"), st: document.getElementById("stMC") },
        { agent: td, cv: document.getElementById("cvTD"), st: document.getElementById("stTD") },
      ]
      for (const p of panels) p.ctx = p.cv.getContext("2d")
      let hover = -1
      let frac = 1 // progress of the current move, for smooth motion at low speeds

      function resize() {
        const dpr = window.devicePixelRatio || 1
        for (const p of panels) {
          const w = p.cv.parentElement.clientWidth
          const h = (w * ROWS) / COLS
          p.cv.width = Math.round(w * dpr)
          p.cv.height = Math.round(h * dpr)
          p.cv.style.height = h + "px"
          p.ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          p.w = w
          p.h = h
          p.c = w / COLS
        }
        draw()
        fitFrame()
      }

      function drawArrow(ctx, x, y, a, len, head) {
        const [dx, dy] = DIRS[a]
        const x0 = x - dx * len,
          y0 = y - dy * len,
          x1 = x + dx * len,
          y1 = y + dy * len
        ctx.beginPath()
        ctx.moveTo(x0, y0)
        ctx.lineTo(x1, y1)
        ctx.moveTo(x1 - dx * head - dy * head * 0.8, y1 - dy * head + dx * head * 0.8)
        ctx.lineTo(x1, y1)
        ctx.lineTo(x1 - dx * head + dy * head * 0.8, y1 - dy * head - dx * head * 0.8)
        ctx.stroke()
      }

      function drawPanel(p) {
        const { ctx, w, h, c, agent } = p
        if (!w) return
        ctx.clearRect(0, 0, w, h)
        ctx.fillStyle = COLORS.light
        ctx.fillRect(0, 0, w, h)
        const span = vHi - vLo

        for (let s = 0; s < N; s++) {
          const x = cx(s) * c,
            y = cy(s) * c,
            t = map[s]
          if (t === WALL) {
            ctx.fillStyle = withAlpha(COLORS.dark, 0.78)
            ctx.fillRect(x, y, c, c)
          } else if (t === LAVA) {
            ctx.fillStyle = withAlpha(COLORS.danger, 0.45)
            ctx.fillRect(x, y, c, c)
            ctx.strokeStyle = withAlpha(COLORS.danger, 0.95)
            ctx.lineWidth = Math.max(1, c * 0.045)
            for (const yy of [0.38, 0.66]) {
              const yv = y + yy * c
              ctx.beginPath()
              ctx.moveTo(x + 0.18 * c, yv)
              ctx.quadraticCurveTo(x + 0.34 * c, yv - 0.1 * c, x + 0.5 * c, yv)
              ctx.quadraticCurveTo(x + 0.66 * c, yv + 0.1 * c, x + 0.82 * c, yv)
              ctx.stroke()
            }
          } else if (t === GOAL) {
            ctx.fillStyle = withAlpha(COLORS.goal, 0.22)
            ctx.fillRect(x, y, c, c)
            ctx.strokeStyle = COLORS.goal
            ctx.fillStyle = COLORS.goal
            ctx.lineWidth = Math.max(1.2, c * 0.06)
            ctx.beginPath()
            ctx.arc(x + c / 2, y + c / 2, c * 0.3, 0, 2 * Math.PI)
            ctx.stroke()
            ctx.beginPath()
            ctx.arc(x + c / 2, y + c / 2, c * 0.11, 0, 2 * Math.PI)
            ctx.fill()
          } else {
            if (agent.visits[s] > 0) {
              if (opt.values) {
                const v = Math.min(1, Math.max(0, (agent.maxQ(s) - vLo) / span))
                ctx.fillStyle = withAlpha(COLORS.secondary, 0.05 + 0.68 * v)
                ctx.fillRect(x, y, c, c)
              }
            } else {
              ctx.fillStyle = withAlpha(COLORS.gray, 0.7)
              ctx.beginPath()
              ctx.arc(x + c / 2, y + c / 2, Math.max(1, c * 0.04), 0, 2 * Math.PI)
              ctx.fill()
            }
          }
        }

        // grid lines
        ctx.strokeStyle = COLORS.lightgray
        ctx.lineWidth = 1
        ctx.beginPath()
        for (let i = 1; i < COLS; i++) {
          const x = Math.round(i * c) + 0.5
          ctx.moveTo(x, 0)
          ctx.lineTo(x, h)
        }
        for (let j = 1; j < ROWS; j++) {
          const y = Math.round(j * c) + 0.5
          ctx.moveTo(0, y)
          ctx.lineTo(w, y)
        }
        ctx.stroke()

        // cells whose Q-values were just updated
        if (opt.flash) {
          for (let s = 0; s < N; s++) {
            const f = agent.flash[s]
            if (f < 0.03) continue
            const x = cx(s) * c,
              y = cy(s) * c
            ctx.fillStyle = withAlpha(COLORS.flash, 0.4 * f)
            ctx.fillRect(x, y, c, c)
            ctx.strokeStyle = withAlpha(COLORS.flash, Math.min(1, 1.2 * f))
            ctx.lineWidth = 2
            ctx.strokeRect(x + 1, y + 1, c - 2, c - 2)
          }
        }

        // greedy policy
        if (opt.policy) {
          ctx.strokeStyle = withAlpha(COLORS.dark, 0.6)
          ctx.lineWidth = Math.max(1.1, c * 0.05)
          ctx.lineCap = "round"
          ctx.lineJoin = "round"
          for (let s = 0; s < N; s++) {
            if (!isOpen(s) || agent.visits[s] === 0) continue
            const a = agent.greedy(s, false)
            if (a < 0) continue
            drawArrow(ctx, cx(s) * c + c / 2, cy(s) * c + c / 2, a, c * 0.2, c * 0.11)
          }
        }

        // start marker (in the corner, so the policy arrow stays readable)
        ctx.fillStyle = COLORS.dark
        ctx.font = `600 ${Math.round(c * 0.3)}px "Source Sans Pro", system-ui, sans-serif`
        ctx.textAlign = "center"
        ctx.textBaseline = "middle"
        ctx.fillText("S", cx(start) * c + c * 0.22, cy(start) * c + c * 0.24)
        ctx.strokeStyle = withAlpha(COLORS.dark, 0.5)
        ctx.setLineDash([3, 3])
        ctx.lineWidth = 1
        ctx.strokeRect(cx(start) * c + 2.5, cy(start) * c + 2.5, c - 5, c - 5)
        ctx.setLineDash([])

        if (hover >= 0) {
          ctx.strokeStyle = COLORS.dark
          ctx.lineWidth = 2
          ctx.strokeRect(cx(hover) * c + 1, cy(hover) * c + 1, c - 2, c - 2)
        }

        // robot position (interpolated between the last two cells at low speeds)
        const e = frac < 1 ? 0.5 - 0.5 * Math.cos(Math.PI * frac) : 1
        const rx = (cx(agent.prevS) + (cx(agent.s) - cx(agent.prevS)) * e + 0.5) * c
        const ry = (cy(agent.prevS) + (cy(agent.s) - cy(agent.prevS)) * e + 0.5) * c

        // trail of the current episode; dashed for MC while its updates are still pending
        if (opt.trail && agent.trail.length > 1) {
          const lw = Math.max(1.5, c * 0.07)
          ctx.lineCap = "round"
          ctx.lineJoin = "round"
          if (agent.kind === "mc" && !agent.pendingReset) ctx.setLineDash([c * 0.15, c * 0.15])
          ctx.beginPath()
          const tr = agent.trail
          ctx.moveTo((cx(tr[0]) + 0.5) * c, (cy(tr[0]) + 0.5) * c)
          for (let i = 1; i < tr.length - 1; i++)
            ctx.lineTo((cx(tr[i]) + 0.5) * c, (cy(tr[i]) + 0.5) * c)
          ctx.lineTo(rx, ry)
          // in the agent's color, over a thin light halo so it stays visible on the shaded cells
          ctx.strokeStyle = withAlpha(COLORS.light, 0.8)
          ctx.lineWidth = lw + 2
          ctx.stroke()
          ctx.strokeStyle = agent.kind === "mc" ? COLORS.mc : COLORS.secondary
          ctx.lineWidth = lw
          ctx.stroke()
          ctx.setLineDash([])
        }

        ctx.fillStyle = agent.kind === "mc" ? COLORS.mc : COLORS.secondary
        ctx.strokeStyle = COLORS.light
        ctx.lineWidth = 2
        ctx.beginPath()
        ctx.arc(rx, ry, c * 0.27, 0, 2 * Math.PI)
        ctx.fill()
        ctx.stroke()
      }

      const fmt = (v, d = 1) => (v === null || v === undefined ? "–" : v.toFixed(d).replace("-", "−"))

      function updateStatus() {
        for (const p of panels) {
          const ag = p.agent
          const rate = ag.outcomes.length
            ? `${ag.outcomes.filter(Boolean).length}/${ag.outcomes.length}`
            : "–"
          let line2
          if (ag.kind === "mc") {
            line2 = ag.pendingReset
              ? `<b>episode over: updated ${ag.lastUpdated} Q-values towards G</b>`
              : `<b>${ag.traj.length / 3} visits waiting for the episode to end</b>`
          } else {
            line2 =
              ag.lastDelta === null
                ? "<b>no updates yet</b>"
                : `<b>updates Q(s,a) every step · last δ = ${fmt(ag.lastDelta, 2)}</b>`
          }
          // three fixed, non-wrapping lines so the panel height never changes
          p.st.innerHTML =
            `<div>episode ${ag.episodes + (ag.pendingReset ? 0 : 1)} · step ${ag.t}/${MAX_STEPS}</div>` +
            `<div>last return ${fmt(ag.lastReturn, 2)} · reached goal ${rate}</div>` +
            `<div>${line2}</div>`
        }
      }

      const readout = document.getElementById("readout")
      function updateReadout() {
        if (hover < 0) {
          readout.innerHTML = "<div>Hover over a cell to compare the estimates with V*.</div><div>&nbsp;</div>"
          return
        }
        const s = hover
        const where = `cell (${cx(s)}, ${cy(s)})`
        if (!isOpen(s)) {
          readout.innerHTML = `<div>${where} · ${{ [WALL]: "wall", [LAVA]: "lava", [GOAL]: "goal" }[map[s]] || "empty"}</div><div>&nbsp;</div>`
          return
        }
        const part = (ag, name) =>
          `${name} ${ag.visits[s] ? fmt(ag.maxQ(s), 2) : "unvisited"} (${ag.visits[s]} updates)`
        readout.innerHTML = `<div>${where} · V* ${fmt(Vstar[s], 2)}</div><div>${part(mc, "MC")} · ${part(td, "TD")}</div>`
      }

      // ---------------------------------------------------------------------
      // Plots
      // ---------------------------------------------------------------------
      const plots = {
        ret: { cv: document.getElementById("pRet") },
        succ: { cv: document.getElementById("pSucc") },
        err: { cv: document.getElementById("pErr") },
      }
      for (const k in plots) plots[k].ctx = plots[k].cv.getContext("2d")

      function resizePlots() {
        const dpr = window.devicePixelRatio || 1
        for (const k in plots) {
          const p = plots[k]
          const w = p.cv.clientWidth,
            h = p.cv.clientHeight
          p.cv.width = Math.round(w * dpr)
          p.cv.height = Math.round(h * dpr)
          p.ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          p.w = w
          p.h = h
        }
      }

      function niceStep(span, n) {
        const raw = span / n
        const mag = Math.pow(10, Math.floor(Math.log10(raw)))
        const f = raw / mag
        return (f >= 5 ? 10 : f >= 2 ? 5 : f >= 1.5 ? 2 : 1) * mag
      }
      function tickLabel(v) {
        const a = Math.abs(v)
        let s
        if (a >= 1e6) s = +(v / 1e6).toFixed(1) + "M"
        else if (a >= 1e3) s = +(v / 1e3).toFixed(1) + "k"
        else s = +v.toFixed(2) + ""
        return s.replace("-", "−")
      }

      function drawPlot(p, series, { yMin, yMax, raw }) {
        const { ctx, w, h } = p
        if (!w) return
        ctx.clearRect(0, 0, w, h)
        const L = 40,
          R = 8,
          T = 6,
          B = 20
        let xMax = 10
        for (const sr of series) for (const q of sr.pts) xMax = Math.max(xMax, q.x)
        let lo = yMin,
          hi = yMax
        for (const sr of series)
          for (const q of sr.pts) {
            if (lo === undefined || q.y < lo) lo = q.y
            if (hi === undefined || q.y > hi) hi = q.y
          }
        if (lo === undefined) lo = 0
        if (hi === undefined) hi = 1
        if (hi - lo < 1e-6) hi = lo + 1
        const X = (x) => L + (x / xMax) * (w - L - R)
        const Y = (y) => T + (1 - (y - lo) / (hi - lo)) * (h - T - B)

        ctx.font = '10.5px "IBM Plex Mono", ui-monospace, monospace'
        ctx.fillStyle = COLORS.gray
        ctx.strokeStyle = COLORS.lightgray
        ctx.lineWidth = 1
        ctx.textAlign = "right"
        ctx.textBaseline = "middle"
        const ys = niceStep(hi - lo, 4)
        for (let v = Math.ceil(lo / ys) * ys; v <= hi + 1e-9; v += ys) {
          const y = Math.round(Y(v)) + 0.5
          ctx.beginPath()
          ctx.moveTo(L, y)
          ctx.lineTo(w - R, y)
          ctx.stroke()
          ctx.fillText(tickLabel(v), L - 5, y)
        }
        ctx.textAlign = "center"
        ctx.textBaseline = "top"
        const xs = niceStep(xMax, Math.max(2, Math.floor((w - L) / 70)))
        for (let v = 0; v <= xMax + 1e-9; v += xs) ctx.fillText(tickLabel(v), X(v), h - B + 5)
        ctx.textAlign = "right"
        ctx.textBaseline = "bottom"
        ctx.fillText("environment steps", w - R, h - B - 2)

        ctx.save()
        ctx.beginPath()
        ctx.rect(L, T - 2, w - L - R, h - T - B + 4)
        ctx.clip()
        for (const sr of series) {
          if (raw) {
            ctx.fillStyle = withAlpha(sr.color, 0.28)
            for (const q of sr.pts) ctx.fillRect(X(q.x) - 1.2, Y(q.y) - 1.2, 2.4, 2.4)
          }
        }
        for (const sr of series) {
          if (sr.pts.length < 2) continue
          ctx.strokeStyle = sr.color
          ctx.lineWidth = 2
          ctx.lineJoin = "round"
          ctx.beginPath()
          sr.pts.forEach((q, i) => {
            const v = raw ? q.e : q.y
            i ? ctx.lineTo(X(q.x), Y(v)) : ctx.moveTo(X(q.x), Y(v))
          })
          ctx.stroke()
        }
        ctx.restore()
        if (!series.some((sr) => sr.pts.length)) {
          ctx.fillStyle = COLORS.gray
          ctx.textAlign = "center"
          ctx.textBaseline = "middle"
          ctx.font = '12px "Source Sans Pro", system-ui, sans-serif'
          ctx.fillText("waiting for the first episode…", (L + w - R) / 2, (T + h - B) / 2)
        }
      }

      function drawPlots() {
        drawPlot(
          plots.ret,
          [
            { pts: mc.hist.pts, color: COLORS.mc },
            { pts: td.hist.pts, color: COLORS.secondary },
          ],
          { yMax: 1, raw: true },
        )
        drawPlot(
          plots.succ,
          [
            { pts: mc.succ.pts, color: COLORS.mc },
            { pts: td.succ.pts, color: COLORS.secondary },
          ],
          { yMin: 0, yMax: 100 },
        )
        drawPlot(
          plots.err,
          [
            { pts: mc.err.pts, color: COLORS.mc },
            { pts: td.err.pts, color: COLORS.secondary },
          ],
          { yMin: 0 },
        )
      }

      function draw() {
        if (!COLORS.light) return
        for (const p of panels) drawPanel(p)
        drawPlots()
        updateStatus()
      }

      // ---------------------------------------------------------------------
      // Painting
      // ---------------------------------------------------------------------
      let tool = "wall"
      let painting = false,
        paintTool = null,
        lastPainted = -1

      function cellAt(p, ev) {
        const r = p.cv.getBoundingClientRect()
        const x = Math.floor(((ev.clientX - r.left) / r.width) * COLS)
        const y = Math.floor(((ev.clientY - r.top) / r.height) * ROWS)
        if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return -1
        return idx(x, y)
      }

      function applyTool(s, t) {
        if (t === "start") {
          if (s === start) return
          if (!isOpen(s)) map[s] = EMPTY
          start = s
          mapChanged()
          return
        }
        if (s === start) return
        const type = { wall: WALL, lava: LAVA, goal: GOAL, erase: EMPTY }[t]
        if (map[s] === type) return
        map[s] = type
        mapChanged()
      }

      for (const p of panels) {
        p.cv.addEventListener("pointerdown", (ev) => {
          const s = cellAt(p, ev)
          if (s < 0) return
          ev.preventDefault()
          painting = true
          paintTool = ev.button === 2 ? "erase" : tool
          p.cv.setPointerCapture(ev.pointerId)
          applyTool(s, paintTool)
          lastPainted = s
          draw()
        })
        p.cv.addEventListener("pointermove", (ev) => {
          const s = cellAt(p, ev)
          hover = s
          if (painting && s >= 0 && s !== lastPainted && paintTool !== "start") {
            applyTool(s, paintTool)
            lastPainted = s
          }
          updateReadout()
        })
        const end = () => {
          painting = false
          lastPainted = -1
        }
        p.cv.addEventListener("pointerup", end)
        p.cv.addEventListener("pointercancel", end)
        p.cv.addEventListener("pointerleave", () => {
          hover = -1
          updateReadout()
        })
        p.cv.addEventListener("contextmenu", (ev) => ev.preventDefault())
      }

      document.querySelectorAll("#tools button").forEach((b) =>
        b.addEventListener("click", () => {
          tool = b.dataset.tool
          document
            .querySelectorAll("#tools button")
            .forEach((o) => o.setAttribute("aria-pressed", o === b ? "true" : "false"))
        }),
      )

      // random map whose goal is reachable from the start without crossing lava
      function randomMap() {
        for (let attempt = 0; attempt < 200; attempt++) {
          map.fill(EMPTY)
          for (let s = 0; s < N; s++) {
            const u = Math.random()
            map[s] = u < 0.16 ? WALL : u < 0.24 ? LAVA : EMPTY
          }
          const st = (Math.random() * N) | 0
          const gl = (Math.random() * N) | 0
          if (st === gl) continue
          map[st] = EMPTY
          map[gl] = GOAL
          const dist = new Int32Array(N).fill(-1)
          dist[st] = 0
          const q = [st]
          while (q.length) {
            const s = q.shift()
            if (s === gl) break
            for (let a = 0; a < 4; a++) {
              const n = move(s, a)
              if (dist[n] < 0 && map[n] !== LAVA) {
                dist[n] = dist[s] + 1
                q.push(n)
              }
            }
          }
          if (dist[gl] >= 9) {
            start = st
            return
          }
        }
        cliffMap()
      }

      // ---------------------------------------------------------------------
      // Controls
      // ---------------------------------------------------------------------
      let running = true
      const sliders = [
        ["sA", "vA", "alpha", (v) => v.toFixed(2)],
        ["sE", "vE", "eps", (v) => v.toFixed(2)],
        ["sG", "vG", "gamma", (v) => v.toFixed(2)],
        ["sS", "vS", "slip", (v) => v.toFixed(2)],
        ["sV", "vV", "speed", (v) => Math.round(Math.pow(10, v)) + " steps/s"],
      ]
      function syncSliders() {
        for (const [sid, vid, key, f] of sliders) {
          document.getElementById(sid).value = P[key]
          document.getElementById(vid).textContent = f(P[key])
        }
      }
      for (const [sid, vid, key, f] of sliders) {
        document.getElementById(sid).addEventListener("input", (e) => {
          P[key] = parseFloat(e.target.value)
          document.getElementById(vid).textContent = f(P[key])
          if (key === "gamma" || key === "slip") computeVstar()
        })
      }

      function setRunning(r) {
        running = r
        if (!r) frac = 1
        document.getElementById("play").textContent = r ? "Pause" : "Play"
      }
      document.getElementById("play").addEventListener("click", () => setRunning(!running))
      document.getElementById("step").addEventListener("click", () => {
        setRunning(false)
        tick()
        frac = 1
        draw()
      })
      document.getElementById("resetLearn").addEventListener("click", () => {
        for (const ag of agents) ag.reset()
        draw()
      })
      function loadMap(fn) {
        fn()
        mapChanged()
        for (const ag of agents) ag.reset()
        draw()
      }
      document.getElementById("mapCliff").addEventListener("click", () => loadMap(cliffMap))
      document.getElementById("clearMap").addEventListener("click", () => {
        for (let s = 0; s < N; s++) if (map[s] !== GOAL) map[s] = EMPTY
        mapChanged()
        draw()
      })
      document.getElementById("randMap").addEventListener("click", () => loadMap(randomMap))
      document.getElementById("defaults").addEventListener("click", () => {
        Object.assign(P, DEFAULTS)
        syncSliders()
        computeVstar()
      })

      function setMethod(m) {
        tdMethod = m
        document.getElementById("mSarsa").setAttribute("aria-pressed", m === "sarsa")
        document.getElementById("mQ").setAttribute("aria-pressed", m === "q")
        document.getElementById("tdName").textContent =
          m === "sarsa" ? "TD: SARSA" : "TD: Q-learning"
        td.a = td.policy(td.s)
      }
      function setStarts(random) {
        opt.randomStarts = random
        document.getElementById("stFixed").setAttribute("aria-pressed", !random)
        document.getElementById("stRandom").setAttribute("aria-pressed", random)
      }
      document.getElementById("stFixed").addEventListener("click", () => setStarts(false))
      document.getElementById("stRandom").addEventListener("click", () => setStarts(true))
      document.getElementById("mSarsa").addEventListener("click", () => setMethod("sarsa"))
      document.getElementById("mQ").addEventListener("click", () => setMethod("q"))

      for (const [id, key] of [
        ["cValues", "values"],
        ["cPolicy", "policy"],
        ["cFlash", "flash"],
        ["cTrail", "trail"],
      ]) {
        document.getElementById(id).addEventListener("change", (e) => {
          opt[key] = e.target.checked
          draw()
        })
      }

      // ---------------------------------------------------------------------
      // Embedding: size the parent iframe to fit the content
      // ---------------------------------------------------------------------
      function fitFrame() {
        try {
          const fe = window.frameElement
          const h = Math.ceil(document.getElementById("wrap").getBoundingClientRect().height)
          const px = h + 4 + "px"
          // only write when it changes, so the observer below does not trigger itself
          if (fe && fe.style.height !== px) fe.style.height = px
        } catch (e) {}
      }

      // ---------------------------------------------------------------------
      // Main loop
      // ---------------------------------------------------------------------
      let last = performance.now(),
        acc = 0
      function frame(now) {
        const dt = Math.min(0.1, (now - last) / 1000)
        last = now
        if (running) {
          const sps = Math.pow(10, P.speed)
          acc += dt * sps
          let n = Math.floor(acc)
          acc -= n
          n = Math.min(n, 4000)
          for (let i = 0; i < n; i++) tick()
          frac = sps <= 12 ? acc : 1
        }
        // highlights fade over ~0.45 s at low speeds and faster when many steps run per frame
        const tau = Math.max(0.12, Math.min(0.45, 20 / Math.pow(10, P.speed)))
        const decay = Math.exp(-dt / tau)
        for (const ag of agents) for (let s = 0; s < N; s++) ag.flash[s] *= decay
        draw()
        requestAnimationFrame(frame)
      }

      cliffMap()
      computeVstar()
      for (const ag of agents) ag.reset()
      syncSliders()
      updateReadout()
      readColors()
      watchTheme()
      new ResizeObserver(resize).observe(document.querySelector(".panels"))
      new ResizeObserver(() => {
        resizePlots()
        draw()
      }).observe(document.querySelector(".plots"))
      resizePlots()
      new ResizeObserver(fitFrame).observe(document.getElementById("wrap"))
      // Quartz's SPA navigation (e.g. clicking the current page in the sidebar) patches the
      // parent page in place: the iframe is kept without reloading, but its inline height is reset
      // to the one in the markdown. Re-fit whenever the frame's style attribute changes.
      try {
        if (window.frameElement)
          new MutationObserver(fitFrame).observe(window.frameElement, { attributes: true, attributeFilter: ["style"] })
      } catch (e) {}
      resize()
      requestAnimationFrame(frame)
    </script>
  </body>
</html>
