<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MPPI Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&family=IBM+Plex+Mono&display=swap"
    />
    <style>
      :root {
        --light: #ffffff;
        --lightgray: #e5e5e5;
        --gray: #b8b8b8;
        --darkgray: #4e4e4e;
        --dark: #2b2b2b;
        --secondary: #0065bd;
        --tertiary: #64a0c8;
        --danger: #d1495b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --light: #161618;
          --lightgray: #393639;
          --gray: #646464;
          --darkgray: #d4d4d4;
          --dark: #ebebec;
          --secondary: #64a0c8;
          --tertiary: #0065bd;
          --danger: #e07a87;
        }
      }
      :root[data-theme="dark"] {
        --light: #161618;
        --lightgray: #393639;
        --gray: #646464;
        --darkgray: #d4d4d4;
        --dark: #ebebec;
        --secondary: #64a0c8;
        --tertiary: #0065bd;
        --danger: #e07a87;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--light);
        color: var(--darkgray);
        font-family: "Source Sans Pro", system-ui, sans-serif;
        font-size: 15px;
      }
      #wrap {
        padding: 2px;
      }
      #stage {
        position: relative;
        border: 1px solid var(--lightgray);
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
        cursor: crosshair;
      }
      .overlay {
        position: absolute;
        padding: 5px 9px;
        border: 1px solid var(--lightgray);
        border-radius: 6px;
        background: var(--light);
        background: color-mix(in srgb, var(--light) 88%, transparent);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        color: var(--dark);
        pointer-events: none;
        user-select: none;
      }
      #hint {
        left: 8px;
        bottom: 8px;
        right: 8px;
        width: fit-content;
        font-size: 14px;
        line-height: 1.35;
      }
      #hint b {
        font-weight: 600;
        color: var(--secondary);
      }
      #status {
        right: 8px;
        top: 8px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12.5px;
        text-align: right;
        line-height: 1.5;
        white-space: pre;
      }
      @media (max-width: 520px) {
        #hint {
          font-size: 12px;
        }
        #status {
          font-size: 11px;
        }
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0 6px;
      }
      button {
        font: inherit;
        font-size: 14px;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid var(--lightgray);
        background: var(--light);
        color: var(--dark);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--secondary);
        color: var(--secondary);
      }
      button.primary {
        background: var(--secondary);
        border-color: var(--secondary);
        color: var(--light);
      }
      button.toggle[aria-pressed="true"] {
        background: var(--tertiary);
        border-color: var(--tertiary);
        color: var(--light);
      }
      button.primary:hover,
      button.toggle[aria-pressed="true"]:hover {
        color: var(--light);
        opacity: 0.9;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 4px 20px;
      }
      label.slider {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        font-size: 14px;
        gap: 0 8px;
      }
      label.slider span.val {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--dark);
      }
      label.slider input {
        grid-column: 1 / 3;
        width: 100%;
        accent-color: var(--secondary);
        margin: 2px 0 6px;
      }
      .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        font-size: 14px;
        margin-top: 2px;
      }
      .toggles input {
        accent-color: var(--secondary);
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="cv"></canvas>
        <div id="hint" class="overlay">
          <b>Click</b> set target · <b>Drag</b> move obstacle · <b>Double-click</b> remove ·
          <b>Scroll</b> resize
        </div>
        <div id="status" class="overlay"></div>
      </div>

      <div class="bar">
        <button id="play" class="primary">Pause</button>
        <button id="resetRobot">Reset robot</button>
        <button id="addObs">Add obstacle</button>
        <button id="shuffle">Random obstacles</button>
        <button id="defaults">Default parameters</button>
        <button id="auto" class="toggle" aria-pressed="true">Auto mode: on</button>
      </div>

      <div class="grid">
        <label class="slider"
          >Samples K <span class="val" id="vK"></span>
          <input id="sK" type="range" min="50" max="3000" step="50"
        /></label>
        <label class="slider"
          >Horizon T (steps) <span class="val" id="vT"></span>
          <input id="sT" type="range" min="10" max="100" step="1"
        /></label>
        <label class="slider"
          >Temperature λ <span class="val" id="vL"></span>
          <input id="sL" type="range" min="-3" max="2" step="0.01"
        /></label>
        <label class="slider"
          >Noise σ<sub>v</sub> <span class="val" id="vSv"></span>
          <input id="sSv" type="range" min="0.05" max="2" step="0.05"
        /></label>
        <label class="slider"
          >Noise σ<sub>ω</sub> <span class="val" id="vSw"></span>
          <input id="sSw" type="range" min="0.05" max="4" step="0.05"
        /></label>
        <label class="slider"
          >Obstacle weight <span class="val" id="vOw"></span>
          <input id="sOw" type="range" min="0" max="200" step="1"
        /></label>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="cSamples" checked /> Show samples</label>
        <label><input type="checkbox" id="cPlan" checked /> Show optimal plan</label>
        <label><input type="checkbox" id="cTrail" checked /> Show trail</label>
      </div>
    </div>

    <script>
      "use strict"

      // ---------------------------------------------------------------------
      // World, robot model and parameters
      // ---------------------------------------------------------------------
      const WORLD = { w: 12, h: 8 } // meters
      const ROBOT_R = 0.22 // robot radius [m]
      const GOAL_R = 0.25 // radius of the goal ring; reaching it counts as reaching the target [m]
      const DT = 0.05 // control period [s]
      const V_MIN = -0.6,
        V_MAX = 1.6 // linear velocity bounds [m/s]
      const W_MAX = 2.5 // angular velocity bound [rad/s]

      const DEFAULTS = { K: 800, T: 50, lambda: 0.3, sigV: 0.6, sigW: 1.5, wObs: 60 }
      const P = { ...DEFAULTS }

      const robot = { x: 1.2, y: 4, th: 0, v: 0, w: 0 }
      const goal = { x: 10.6, y: 4 }
      let obstacles = []
      let trail = []

      function defaultObstacles() {
        return [
          { x: 4.2, y: 4.1, r: 0.8 },
          { x: 6.4, y: 2.4, r: 0.65 },
          { x: 6.6, y: 5.7, r: 0.7 },
          { x: 8.4, y: 3.9, r: 0.55 },
          { x: 3.2, y: 1.6, r: 0.5 },
        ]
      }

      // ---------------------------------------------------------------------
      // Random numbers (Box–Muller with caching)
      // ---------------------------------------------------------------------
      let spare = null
      function randn() {
        if (spare !== null) {
          const s = spare
          spare = null
          return s
        }
        let u = 0
        while (u === 0) u = Math.random()
        const v = Math.random()
        const m = Math.sqrt(-2 * Math.log(u))
        spare = m * Math.sin(2 * Math.PI * v)
        return m * Math.cos(2 * Math.PI * v)
      }

      const clamp = (a, lo, hi) => (a < lo ? lo : a > hi ? hi : a)

      // ---------------------------------------------------------------------
      // MPPI buffers
      // ---------------------------------------------------------------------
      let U = new Float32Array(P.T * 2) // nominal control sequence [v, w]
      let EPS, S, Wt, TRAJ, CRASH, PLAN
      let bufK = 0,
        bufT = 0

      function ensureBuffers() {
        if (P.T !== U.length / 2) {
          // resize nominal sequence, keep the existing prefix
          const nu = new Float32Array(P.T * 2)
          nu.set(U.subarray(0, Math.min(U.length, nu.length)))
          U = nu
        }
        if (bufK === P.K && bufT === P.T) return
        bufK = P.K
        bufT = P.T
        EPS = new Float32Array(P.K * P.T * 2)
        S = new Float64Array(P.K)
        Wt = new Float64Array(P.K)
        TRAJ = new Float32Array(P.K * (P.T + 1) * 2)
        CRASH = new Uint8Array(P.K)
        PLAN = new Float32Array((P.T + 1) * 2)
      }

      // ---------------------------------------------------------------------
      // Cost function
      // ---------------------------------------------------------------------
      const W_GOAL = 1.0 // stage cost on distance to goal
      const W_TERM = 6.0 // terminal cost on distance to goal
      const W_CTRL = 0.02 // small effort penalty on (v^2 + w^2)
      const W_REV = 10 // penalty on driving backwards (v < 0), so the robot prefers to turn
      const W_HEAD = 1.0 // penalty on not facing the goal, helps the robot turn around
      const OBS_MARGIN = 0.35 // soft safety band around obstacles [m]
      const CRASH_COST = 1e4

      // returns -1 on collision, otherwise the obstacle/boundary penalty
      function stateCost(x, y) {
        if (x < ROBOT_R || x > WORLD.w - ROBOT_R || y < ROBOT_R || y > WORLD.h - ROBOT_R) return -1
        let c = 0
        for (let j = 0; j < obstacles.length; j++) {
          const o = obstacles[j]
          const dx = x - o.x,
            dy = y - o.y
          const d = Math.sqrt(dx * dx + dy * dy) - o.r - ROBOT_R
          if (d < 0) return -1
          if (d < OBS_MARGIN) {
            const p = (OBS_MARGIN - d) / OBS_MARGIN
            c += P.wObs * p * p
          }
        }
        return c
      }

      // ---------------------------------------------------------------------
      // One MPPI iteration
      // ---------------------------------------------------------------------
      const stats = { ess: 0, minCost: 0, ms: 0, crashedFrac: 0 }
      const EXPLORE_FRAC = 0.03 // fraction of samples drawn around zero instead of U

      function mppiStep() {
        ensureBuffers()
        const t0 = performance.now()
        const { K, T, lambda, sigV, sigW } = P
        const isv = 1 / (sigV * sigV),
          isw = 1 / (sigW * sigW)
        const gamma = 0.1 * lambda // control-cost weight (lambda * (1 - alpha))
        const nExplore = Math.floor(K * EXPLORE_FRAC)
        let minS = Infinity,
          nCrash = 0

        for (let k = 0; k < K; k++) {
          let x = robot.x,
            y = robot.y,
            th = robot.th
          let s = 0
          let dead = false
          const explore = k < nExplore
          const tb = k * (T + 1) * 2
          TRAJ[tb] = x
          TRAJ[tb + 1] = y

          for (let t = 0; t < T; t++) {
            const i = (k * T + t) * 2
            const u0 = U[2 * t],
              u1 = U[2 * t + 1]
            // sample, clamp to the actuator limits and store the effective perturbation
            const v = clamp((explore ? 0 : u0) + randn() * sigV, V_MIN, V_MAX)
            const w = clamp((explore ? 0 : u1) + randn() * sigW, -W_MAX, W_MAX)
            const ev = v - u0,
              ew = w - u1
            EPS[i] = ev
            EPS[i + 1] = ew

            if (!dead) {
              // unicycle kinematics (forward Euler)
              const c = Math.cos(th),
                sn = Math.sin(th)
              x += v * c * DT
              y += v * sn * DT
              th += w * DT

              const sc = stateCost(x, y)
              if (sc < 0) {
                dead = true
                s += CRASH_COST * (T - t) * DT
              } else {
                const dx = goal.x - x,
                  dy = goal.y - y
                const d = Math.sqrt(dx * dx + dy * dy)
                const rev = v < 0 ? W_REV * v * v : 0
                // 1 - cos(angle between heading and goal direction), faded out near the goal
                const head = d > 1e-6 ? W_HEAD * Math.min(1, d) * (1 - (c * dx + sn * dy) / d) : 0
                s += (W_GOAL * d + W_CTRL * (v * v + w * w) + rev + head + sc) * DT
              }
            }
            // information-theoretic control cost  gamma * u^T Sigma^-1 eps
            s += gamma * (u0 * ev * isv + u1 * ew * isw) * DT

            const p = tb + (t + 1) * 2
            TRAJ[p] = x
            TRAJ[p + 1] = y
          }
          if (!dead) {
            const dx = x - goal.x,
              dy = y - goal.y
            s += W_TERM * Math.sqrt(dx * dx + dy * dy)
          } else nCrash++
          CRASH[k] = dead ? 1 : 0
          S[k] = s
          if (s < minS) minS = s
        }

        // importance weights  w_k ∝ exp(-(S_k - min S) / lambda)
        let sumW = 0
        for (let k = 0; k < K; k++) {
          const w = Math.exp(-(S[k] - minS) / lambda)
          Wt[k] = w
          sumW += w
        }
        let sumW2 = 0
        for (let k = 0; k < K; k++) {
          Wt[k] /= sumW
          sumW2 += Wt[k] * Wt[k]
        }

        // weighted average of the perturbations
        for (let t = 0; t < T; t++) {
          let dv = 0,
            dw = 0
          for (let k = 0; k < K; k++) {
            const wk = Wt[k]
            if (wk < 1e-12) continue
            const i = (k * T + t) * 2
            dv += wk * EPS[i]
            dw += wk * EPS[i + 1]
          }
          U[2 * t] = clamp(U[2 * t] + dv, V_MIN, V_MAX)
          U[2 * t + 1] = clamp(U[2 * t + 1] + dw, -W_MAX, W_MAX)
        }

        // light smoothing of the nominal sequence (moving average, window 3)
        for (let c = 0; c < 2; c++) {
          let prev = U[c]
          for (let t = 1; t < T - 1; t++) {
            const cur = U[2 * t + c]
            U[2 * t + c] = (prev + cur + U[2 * (t + 1) + c]) / 3
            prev = cur
          }
        }

        // roll out the updated nominal sequence for display
        let x = robot.x,
          y = robot.y,
          th = robot.th
        PLAN[0] = x
        PLAN[1] = y
        for (let t = 0; t < T; t++) {
          x += U[2 * t] * Math.cos(th) * DT
          y += U[2 * t] * Math.sin(th) * DT
          th += U[2 * t + 1] * DT
          PLAN[2 * (t + 1)] = x
          PLAN[2 * (t + 1) + 1] = y
        }

        stats.ess = 1 / sumW2
        stats.minCost = minS
        stats.crashedFrac = nCrash / K
        stats.ms = performance.now() - t0

        // first control to apply, then shift the sequence (warm start)
        const u = [U[0], U[1]]
        U.copyWithin(0, 2)
        U[2 * T - 2] = U[2 * T - 4]
        U[2 * T - 1] = U[2 * T - 3]
        return u
      }

      // ---------------------------------------------------------------------
      // Plant
      // ---------------------------------------------------------------------
      function simStep() {
        const [v, w] = mppiStep()
        robot.v = v
        robot.w = w
        robot.x += v * Math.cos(robot.th) * DT
        robot.y += v * Math.sin(robot.th) * DT
        robot.th += w * DT
        robot.th = Math.atan2(Math.sin(robot.th), Math.cos(robot.th))
        resolveRobotCollisions()
        const last = trail[trail.length - 1]
        if (!last || Math.hypot(last[0] - robot.x, last[1] - robot.y) > 0.03) {
          trail.push([robot.x, robot.y])
          if (trail.length > 1500) trail.shift()
        }
        checkAutoGoal()
      }

      // ---------------------------------------------------------------------
      // Auto mode: new target + new obstacles whenever the target is reached
      // ---------------------------------------------------------------------
      const GOAL_TIMEOUT = 25 // give up on a target after this long (stuck in a local minimum) [s]
      let autoMode = true
      let goalsReached = 0
      let goalsSkipped = 0
      let legTime = 0

      function checkAutoGoal() {
        if (!autoMode || drag.obj) return
        legTime += DT
        // replace the target as soon as the robot enters the goal ring
        if (Math.hypot(robot.x - goal.x, robot.y - goal.y) < GOAL_R) {
          goalsReached++
          newScene()
        } else if (legTime >= GOAL_TIMEOUT) {
          goalsSkipped++
          newScene()
        }
      }

      // Pick a far-away target roughly in front of the robot, so it drives forward to it.
      // If the robot faces a wall, first shorten the distance, then widen the cone.
      function pickGoal() {
        const m = 1.2 // keep targets away from the walls
        const N = 400
        const cand = []
        for (let i = 0; i < N; i++) {
          const x = m + Math.random() * (WORLD.w - 2 * m)
          const y = m + Math.random() * (WORLD.h - 2 * m)
          const dx = x - robot.x,
            dy = y - robot.y
          const a = Math.atan2(dy, dx) - robot.th
          cand.push({
            x,
            y,
            d: Math.hypot(dx, dy),
            ang: Math.abs(Math.atan2(Math.sin(a), Math.cos(a))),
          })
        }
        const tries = [
          [45, 5],
          [45, 4],
          [45, 2.5],
          [70, 2.5],
          [90, 2],
        ]
        for (const [maxDeg, minDist] of tries) {
          const maxAng = (maxDeg * Math.PI) / 180
          const ok = cand.filter((c) => c.d >= minDist && c.ang <= maxAng)
          if (ok.length) return ok[Math.floor(Math.random() * ok.length)]
        }
        // cornered: take the reachable point that needs the smallest turn
        let best = null
        for (const c of cand) if (c.d >= 1.5 && (!best || c.ang < best.ang)) best = c
        return best || { x: WORLD.w - robot.x, y: WORLD.h - robot.y }
      }

      function newScene() {
        const g = pickGoal()
        goal.x = g.x
        goal.y = g.y
        randomizeObstacles(true)
        trail = []
        legTime = 0
      }

      // obstacles dragged onto the robot push it away instead of trapping it
      function resolveRobotCollisions() {
        for (const o of obstacles) {
          const dx = robot.x - o.x,
            dy = robot.y - o.y
          const d = Math.hypot(dx, dy)
          const minD = o.r + ROBOT_R + 0.01
          if (d < minD) {
            const nx = d > 1e-6 ? dx / d : 1,
              ny = d > 1e-6 ? dy / d : 0
            robot.x = o.x + nx * minD
            robot.y = o.y + ny * minD
          }
        }
        robot.x = clamp(robot.x, ROBOT_R + 0.01, WORLD.w - ROBOT_R - 0.01)
        robot.y = clamp(robot.y, ROBOT_R + 0.01, WORLD.h - ROBOT_R - 0.01)
      }

      // ---------------------------------------------------------------------
      // Theme: follow the Quartz site colors when embedded
      // ---------------------------------------------------------------------
      const COLORS = {}
      function readColors() {
        let src = document.documentElement
        try {
          if (window.parent !== window && window.parent.document) {
            const pr = window.parent.document.documentElement
            const theme = pr.getAttribute("saved-theme")
            if (theme) document.documentElement.setAttribute("data-theme", theme)
            const pcs = getComputedStyle(pr)
            if (pcs.getPropertyValue("--secondary").trim()) src = pr
          }
        } catch (e) {
          /* cross-origin or standalone */
        }
        const cs = getComputedStyle(src)
        const own = getComputedStyle(document.documentElement)
        for (const n of [
          "light",
          "lightgray",
          "gray",
          "darkgray",
          "dark",
          "secondary",
          "tertiary",
        ]) {
          const v = cs.getPropertyValue("--" + n).trim() || own.getPropertyValue("--" + n).trim()
          COLORS[n] = v
          document.documentElement.style.setProperty("--" + n, v)
        }
        COLORS.danger = own.getPropertyValue("--danger").trim() || "#d1495b"
        draw()
      }

      function watchTheme() {
        try {
          if (window.parent !== window) {
            new MutationObserver(readColors).observe(window.parent.document.documentElement, {
              attributes: true,
              attributeFilter: ["saved-theme", "class", "style"],
            })
          }
        } catch (e) {}
        if (window.matchMedia)
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors)
      }

      function withAlpha(color, a) {
        const ctx = probeCtx
        ctx.fillStyle = "#000"
        ctx.fillStyle = color
        const c = ctx.fillStyle // normalized to #rrggbb or rgba()
        if (c[0] === "#") {
          const r = parseInt(c.slice(1, 3), 16),
            g = parseInt(c.slice(3, 5), 16),
            b = parseInt(c.slice(5, 7), 16)
          return `rgba(${r},${g},${b},${a})`
        }
        const m = c.match(/[\d.]+/g)
        return m ? `rgba(${m[0]},${m[1]},${m[2]},${a})` : color
      }
      const probeCtx = document.createElement("canvas").getContext("2d")

      // ---------------------------------------------------------------------
      // Rendering
      // ---------------------------------------------------------------------
      const cv = document.getElementById("cv")
      const ctx = cv.getContext("2d")
      let scale = 50 // px per meter (CSS px)

      function resize() {
        const wCss = cv.parentElement.clientWidth
        const hCss = (wCss * WORLD.h) / WORLD.w
        const dpr = window.devicePixelRatio || 1
        cv.width = Math.round(wCss * dpr)
        cv.height = Math.round(hCss * dpr)
        cv.style.height = hCss + "px"
        scale = wCss / WORLD.w
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
        draw()
        fitFrame()
      }

      // world (y up) -> canvas (y down)
      const X = (x) => x * scale
      const Y = (y) => (WORLD.h - y) * scale

      function drawGrid() {
        ctx.strokeStyle = withAlpha(COLORS.lightgray, 0.7)
        ctx.lineWidth = 1
        ctx.beginPath()
        for (let i = 1; i < WORLD.w; i++) {
          ctx.moveTo(X(i) + 0.5, 0)
          ctx.lineTo(X(i) + 0.5, Y(0))
        }
        for (let j = 1; j < WORLD.h; j++) {
          ctx.moveTo(0, Y(j) + 0.5)
          ctx.lineTo(X(WORLD.w), Y(j) + 0.5)
        }
        ctx.stroke()
      }

      function draw() {
        if (!COLORS.light) return
        const wCss = cv.width / (window.devicePixelRatio || 1)
        const hCss = cv.height / (window.devicePixelRatio || 1)
        ctx.fillStyle = COLORS.light
        ctx.fillRect(0, 0, wCss, hCss)
        drawGrid()

        // trail
        if (opt.trail && trail.length > 1) {
          ctx.strokeStyle = withAlpha(COLORS.gray, 0.9)
          ctx.lineWidth = 2
          ctx.setLineDash([4, 4])
          ctx.beginPath()
          ctx.moveTo(X(trail[0][0]), Y(trail[0][1]))
          for (const p of trail) ctx.lineTo(X(p[0]), Y(p[1]))
          ctx.stroke()
          ctx.setLineDash([])
        }

        // sampled rollouts
        if (opt.samples && TRAJ && bufK === P.K && bufT === P.T) {
          const K = P.K,
            T = P.T
          const maxDraw = 250
          const stride = Math.max(1, Math.floor(K / maxDraw))
          let wMax = 0
          for (let k = 0; k < K; k++) if (Wt[k] > wMax) wMax = Wt[k]
          ctx.lineWidth = 1.25
          for (let k = 0; k < K; k += stride) {
            const tb = k * (T + 1) * 2
            const rel = wMax > 0 ? Wt[k] / wMax : 0
            ctx.strokeStyle = CRASH[k]
              ? withAlpha(COLORS.danger, 0.3)
              : withAlpha(COLORS.secondary, 0.2 + 0.7 * Math.sqrt(rel))
            ctx.beginPath()
            ctx.moveTo(X(TRAJ[tb]), Y(TRAJ[tb + 1]))
            for (let t = 1; t <= T; t++) ctx.lineTo(X(TRAJ[tb + 2 * t]), Y(TRAJ[tb + 2 * t + 1]))
            ctx.stroke()
          }
        }

        // obstacles
        for (const o of obstacles) {
          ctx.beginPath()
          ctx.arc(X(o.x), Y(o.y), (o.r + ROBOT_R + OBS_MARGIN) * scale, 0, 2 * Math.PI)
          ctx.fillStyle = withAlpha(COLORS.gray, 0.12)
          ctx.fill()
          ctx.beginPath()
          ctx.arc(X(o.x), Y(o.y), o.r * scale, 0, 2 * Math.PI)
          ctx.fillStyle = o === drag.obj ? COLORS.darkgray : withAlpha(COLORS.darkgray, 0.8)
          ctx.fill()
        }

        // optimal plan
        if (opt.plan && PLAN && PLAN.length === (P.T + 1) * 2) {
          ctx.lineJoin = "round"
          ctx.lineCap = "round"
          ctx.beginPath()
          ctx.moveTo(X(PLAN[0]), Y(PLAN[1]))
          for (let t = 1; t <= P.T; t++) ctx.lineTo(X(PLAN[2 * t]), Y(PLAN[2 * t + 1]))
          // halo so the plan stays visible on top of the (now stronger) samples
          ctx.strokeStyle = COLORS.light
          ctx.lineWidth = 7
          ctx.stroke()
          ctx.strokeStyle = COLORS.secondary
          ctx.lineWidth = 3.5
          ctx.stroke()
        }

        // goal
        const gx = X(goal.x),
          gy = Y(goal.y)
        ctx.strokeStyle = COLORS.secondary
        ctx.lineWidth = 2
        ctx.beginPath()
        ctx.arc(gx, gy, GOAL_R * scale, 0, 2 * Math.PI)
        ctx.stroke()
        ctx.beginPath()
        ctx.arc(gx, gy, 0.08 * scale, 0, 2 * Math.PI)
        ctx.fillStyle = COLORS.secondary
        ctx.fill()

        // robot
        const rx = X(robot.x),
          ry = Y(robot.y),
          rr = ROBOT_R * scale
        ctx.save()
        ctx.translate(rx, ry)
        ctx.rotate(-robot.th)
        ctx.beginPath()
        ctx.arc(0, 0, rr, 0, 2 * Math.PI)
        ctx.fillStyle = COLORS.light
        ctx.fill()
        ctx.lineWidth = 2.5
        ctx.strokeStyle = COLORS.dark
        ctx.stroke()
        // wheels
        ctx.fillStyle = COLORS.dark
        ctx.fillRect(-rr * 0.5, -rr - 2, rr, 4)
        ctx.fillRect(-rr * 0.5, rr - 2, rr, 4)
        // heading
        ctx.beginPath()
        ctx.moveTo(rr * 0.75, 0)
        ctx.lineTo(-rr * 0.25, rr * 0.45)
        ctx.lineTo(-rr * 0.25, -rr * 0.45)
        ctx.closePath()
        ctx.fillStyle = COLORS.secondary
        ctx.fill()
        ctx.restore()

        document.getElementById("status").textContent =
          `v ${robot.v.toFixed(2)} m/s  ω ${robot.w.toFixed(2)} rad/s\n` +
          `dist ${Math.hypot(robot.x - goal.x, robot.y - goal.y).toFixed(2)} m` +
          (autoMode
            ? `  reached ${goalsReached}` + (goalsSkipped ? ` skipped ${goalsSkipped}` : "")
            : "") +
          "\n" +
          `ESS/K ${(stats.ess / P.K).toFixed(3)}  crashed ${(stats.crashedFrac * 100).toFixed(0)}%\n` +
          `solve ${stats.ms.toFixed(1)} ms`
      }

      // ---------------------------------------------------------------------
      // Interaction
      // ---------------------------------------------------------------------
      const drag = { obj: null, dx: 0, dy: 0, pointerId: null }

      function toWorld(ev) {
        const r = cv.getBoundingClientRect()
        return { x: (ev.clientX - r.left) / scale, y: WORLD.h - (ev.clientY - r.top) / scale }
      }

      function hitObstacle(p) {
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i]
          if (Math.hypot(p.x - o.x, p.y - o.y) <= o.r) return o
        }
        return null
      }

      cv.addEventListener("pointerdown", (ev) => {
        const p = toWorld(ev)
        const o = hitObstacle(p)
        if (o) {
          drag.obj = o
          drag.dx = o.x - p.x
          drag.dy = o.y - p.y
        } else {
          // click (and optionally drag) sets the target
          drag.obj = goal
          drag.dx = 0
          drag.dy = 0
          goal.x = clamp(p.x, ROBOT_R, WORLD.w - ROBOT_R)
          goal.y = clamp(p.y, ROBOT_R, WORLD.h - ROBOT_R)
          legTime = 0
        }
        drag.pointerId = ev.pointerId
        cv.setPointerCapture(ev.pointerId)
        cv.style.cursor = drag.obj === goal ? "crosshair" : "grabbing"
        draw()
      })

      cv.addEventListener("pointermove", (ev) => {
        const p = toWorld(ev)
        if (drag.obj && ev.pointerId === drag.pointerId) {
          const o = drag.obj
          const pad = o === goal ? ROBOT_R : 0
          o.x = clamp(p.x + drag.dx, pad, WORLD.w - pad)
          o.y = clamp(p.y + drag.dy, pad, WORLD.h - pad)
          if (o !== goal) resolveRobotCollisions()
          if (!running) draw()
        } else {
          cv.style.cursor = hitObstacle(p) ? "grab" : "crosshair"
        }
      })

      function endDrag(ev) {
        if (ev.pointerId !== drag.pointerId) return
        drag.obj = null
        drag.pointerId = null
        cv.style.cursor = hitObstacle(toWorld(ev)) ? "grab" : "crosshair"
        draw()
      }
      cv.addEventListener("pointerup", endDrag)
      cv.addEventListener("pointercancel", endDrag)

      cv.addEventListener("dblclick", (ev) => {
        const o = hitObstacle(toWorld(ev))
        if (o) {
          obstacles = obstacles.filter((q) => q !== o)
          draw()
        }
      })

      cv.addEventListener(
        "wheel",
        (ev) => {
          const o = hitObstacle(toWorld(ev))
          if (!o) return
          ev.preventDefault()
          o.r = clamp(o.r * (ev.deltaY < 0 ? 1.08 : 1 / 1.08), 0.15, 2.5)
          resolveRobotCollisions()
          draw()
        },
        { passive: false },
      )

      function validSpot(x, y, r) {
        if (x < r + 0.3 || x > WORLD.w - r - 0.3 || y < r + 0.3 || y > WORLD.h - r - 0.3)
          return false
        if (Math.hypot(x - robot.x, y - robot.y) < r + ROBOT_R + 0.6) return false
        if (Math.hypot(x - goal.x, y - goal.y) < r + ROBOT_R + 0.6) return false
        // keep gaps wide enough for the robot to pass, so random scenes rarely form walls
        return !obstacles.some((o) => Math.hypot(x - o.x, y - o.y) < o.r + r + 1.0)
      }

      function freeSpot(r) {
        for (let tries = 0; tries < 200; tries++) {
          const x = r + 0.3 + Math.random() * (WORLD.w - 2 * r - 0.6)
          const y = r + 0.3 + Math.random() * (WORLD.h - 2 * r - 0.6)
          if (validSpot(x, y, r)) return { x, y, r }
        }
        return null
      }

      // a spot close to the straight line robot -> goal, so the direct path is blocked
      function spotOnPath(r) {
        const dx = goal.x - robot.x,
          dy = goal.y - robot.y
        const len = Math.hypot(dx, dy) || 1
        for (let tries = 0; tries < 100; tries++) {
          const s = 0.25 + 0.5 * Math.random()
          const off = (Math.random() - 0.5) * 1.6
          const x = robot.x + s * dx - (off * dy) / len
          const y = robot.y + s * dy + (off * dx) / len
          if (validSpot(x, y, r)) return { x, y, r }
        }
        return null
      }

      function randomizeObstacles(blockPath) {
        obstacles = []
        const n = 6 + Math.floor(Math.random() * 4)
        const nPath = blockPath ? 2 + Math.floor(Math.random() * 2) : 0
        for (let i = 0; i < n; i++) {
          const r = 0.35 + Math.random() * 0.55
          const o = (i < nPath && spotOnPath(r)) || freeSpot(r)
          if (o) obstacles.push(o)
        }
      }

      // ---------------------------------------------------------------------
      // Controls
      // ---------------------------------------------------------------------
      let running = true
      const opt = { samples: true, plan: true, trail: true }

      const sliders = [
        ["sK", "vK", "K", (v) => v, (v) => v, (v) => String(v)],
        ["sT", "vT", "T", (v) => v, (v) => v, (v) => `${v} (${(v * DT).toFixed(2)} s)`],
        [
          "sL",
          "vL",
          "lambda",
          (v) => Math.pow(10, v),
          (v) => Math.log10(v),
          (v) => v.toPrecision(3),
        ],
        ["sSv", "vSv", "sigV", (v) => v, (v) => v, (v) => v.toFixed(2)],
        ["sSw", "vSw", "sigW", (v) => v, (v) => v, (v) => v.toFixed(2)],
        ["sOw", "vOw", "wObs", (v) => v, (v) => v, (v) => String(v)],
      ]
      function syncSliders() {
        for (const [sid, vid, key, , inv, fmt] of sliders) {
          document.getElementById(sid).value = inv(P[key])
          document.getElementById(vid).textContent = fmt(P[key])
        }
      }
      for (const [sid, vid, key, fwd, , fmt] of sliders) {
        document.getElementById(sid).addEventListener("input", (e) => {
          P[key] = fwd(parseFloat(e.target.value))
          document.getElementById(vid).textContent = fmt(P[key])
          if (!running) draw()
        })
      }

      document.getElementById("play").addEventListener("click", (e) => {
        running = !running
        e.target.textContent = running ? "Pause" : "Play"
        last = performance.now()
        acc = 0
      })
      document.getElementById("resetRobot").addEventListener("click", () => {
        Object.assign(robot, { x: 1.2, y: 4, th: 0, v: 0, w: 0 })
        U.fill(0)
        trail = []
        resolveRobotCollisions()
        draw()
      })
      document.getElementById("addObs").addEventListener("click", () => {
        const o = freeSpot(0.4 + Math.random() * 0.4)
        if (o) obstacles.push(o)
        draw()
      })
      document.getElementById("shuffle").addEventListener("click", () => {
        randomizeObstacles(false)
        draw()
      })
      document.getElementById("auto").addEventListener("click", (e) => {
        autoMode = !autoMode
        legTime = 0
        e.target.setAttribute("aria-pressed", String(autoMode))
        e.target.textContent = `Auto mode: ${autoMode ? "on" : "off"}`
        draw()
      })
      document.getElementById("defaults").addEventListener("click", () => {
        Object.assign(P, DEFAULTS)
        syncSliders()
      })
      for (const [id, key] of [
        ["cSamples", "samples"],
        ["cPlan", "plan"],
        ["cTrail", "trail"],
      ]) {
        document.getElementById(id).addEventListener("change", (e) => {
          opt[key] = e.target.checked
          draw()
        })
      }

      // ---------------------------------------------------------------------
      // Embedding: size the parent iframe to fit the content
      // ---------------------------------------------------------------------
      function fitFrame() {
        try {
          const fe = window.frameElement
          if (fe) fe.style.height = document.documentElement.scrollHeight + "px"
        } catch (e) {}
      }

      // ---------------------------------------------------------------------
      // Main loop (fixed control rate, render every frame)
      // ---------------------------------------------------------------------
      let last = performance.now(),
        acc = 0
      function frame(now) {
        if (running) {
          acc += Math.min(0.1, (now - last) / 1000)
          let steps = 0
          while (acc >= DT && steps < 2) {
            simStep()
            acc -= DT
            steps++
          }
          if (steps === 2) acc = 0 // can't keep up: drop time rather than spiral
        }
        last = now
        draw()
        requestAnimationFrame(frame)
      }

      obstacles = defaultObstacles()
      syncSliders()
      readColors()
      watchTheme()
      new ResizeObserver(resize).observe(document.getElementById("stage"))
      new ResizeObserver(fitFrame).observe(document.body)
      resize()
      requestAnimationFrame(frame)
    </script>
  </body>
</html>
