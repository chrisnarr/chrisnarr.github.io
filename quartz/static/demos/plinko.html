<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plinko TD vs MC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&family=IBM+Plex+Mono&display=swap"
    />
    <style>
      :root {
        --light: #ffffff;
        --lightgray: #e5e5e5;
        --gray: #b8b8b8;
        --darkgray: #4e4e4e;
        --dark: #2b2b2b;
        --secondary: #0065bd;
        --tertiary: #64a0c8;
        --danger: #d1495b;
        --mc: #8e5cc4;
        --flash: #f0a020;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --light: #161618;
          --lightgray: #393639;
          --gray: #646464;
          --darkgray: #d4d4d4;
          --dark: #ebebec;
          --secondary: #64a0c8;
          --tertiary: #0065bd;
          --danger: #e07a87;
          --mc: #b48ee0;
          --flash: #f5b942;
        }
      }
      :root[data-theme="dark"] {
        --light: #161618;
        --lightgray: #393639;
        --gray: #646464;
        --darkgray: #d4d4d4;
        --dark: #ebebec;
        --secondary: #64a0c8;
        --tertiary: #0065bd;
        --danger: #e07a87;
        --mc: #b48ee0;
        --flash: #f5b942;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--light);
        color: var(--darkgray);
        font-family: "Source Sans Pro", system-ui, sans-serif;
        font-size: 15px;
      }
      #wrap {
        padding: 2px;
      }
      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 10px 12px;
      }
      .panel {
        margin: 0;
        min-width: 0;
      }
      .panel figcaption {
        display: flex;
        align-items: baseline;
        gap: 7px;
        font-size: 14px;
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 4px;
      }
      .panel figcaption .name {
        white-space: nowrap;
      }
      .panel figcaption .sub {
        font-weight: 400;
        font-size: 13px;
        color: var(--darkgray);
      }
      .stage {
        position: relative;
        border: 1px solid var(--lightgray);
        border-radius: 8px;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
      }
      .stage canvas {
        cursor: pointer;
      }
      .status {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.5;
        margin-top: 4px;
        color: var(--darkgray);
        min-height: 3em;
      }
      .status b {
        font-weight: 400;
        color: var(--dark);
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        align-self: center;
      }
      .dot.mc {
        background: var(--mc);
      }
      .dot.td {
        background: var(--secondary);
      }
      .dash {
        display: inline-block;
        width: 16px;
        height: 0;
        border-top: 2px dashed var(--darkgray);
        align-self: center;
      }
      #readout {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--darkgray);
        margin: 6px 0 0;
        min-height: 1.5em;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 10px 0 6px;
      }
      .bar .lbl {
        font-size: 14px;
        margin-right: 2px;
      }
      button {
        font: inherit;
        font-size: 14px;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid var(--lightgray);
        background: var(--light);
        color: var(--dark);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--secondary);
        color: var(--secondary);
      }
      button.primary {
        background: var(--secondary);
        border-color: var(--secondary);
        color: var(--light);
      }
      button[aria-pressed="true"] {
        background: var(--tertiary);
        border-color: var(--tertiary);
        color: var(--light);
      }
      button.primary:hover,
      button[aria-pressed="true"]:hover {
        color: var(--light);
        opacity: 0.9;
      }
      .plots {
        margin-top: 4px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 8px 12px;
      }
      .plot {
        min-width: 0;
        margin: 0;
        border: 1px solid var(--lightgray);
        border-radius: 8px;
        padding: 6px 8px 4px;
      }
      .plot figcaption {
        font-size: 13px;
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 2px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
      }
      .plot figcaption .key {
        font-weight: 400;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .plot canvas {
        height: 160px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 4px 20px;
      }
      label.slider {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        font-size: 14px;
        gap: 0 8px;
      }
      label.slider span.val {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--dark);
      }
      label.slider input {
        grid-column: 1 / 3;
        width: 100%;
        accent-color: var(--secondary);
        margin: 2px 0 6px;
      }
      label.slider input:disabled {
        opacity: 0.4;
      }
      .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        font-size: 14px;
        margin-top: 2px;
      }
      .toggles input {
        accent-color: var(--secondary);
      }
      @media (max-width: 520px) {
        .status,
        #readout {
          font-size: 11px;
        }
        button {
          font-size: 13px;
          padding: 4px 9px;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div class="panels">
        <figure class="panel">
          <figcaption>
            <i class="dot mc"></i><span class="name">Monte Carlo</span>
            <span class="sub">target: the payoff the ball actually lands on</span>
          </figcaption>
          <div class="stage">
            <canvas id="cvMC" role="img" aria-label="Plinko board with Monte Carlo estimates"></canvas>
          </div>
          <div class="status" id="stMC"></div>
        </figure>
        <figure class="panel">
          <figcaption>
            <i class="dot td"></i><span class="name">TD(0)</span>
            <span class="sub">target: the estimate of the next peg</span>
          </figcaption>
          <div class="stage">
            <canvas id="cvTD" role="img" aria-label="Plinko board with TD estimates"></canvas>
          </div>
          <div class="status" id="stTD"></div>
        </figure>
      </div>
      <div id="readout"></div>

      <div class="plots">
        <figure class="plot">
          <figcaption>
            RMS error (weighted by visits)
            <span class="key"><i class="dot mc"></i>MC</span>
            <span class="key"><i class="dot td"></i>TD</span>
          </figcaption>
          <canvas id="pErr" role="img" aria-label="RMS value error over balls"></canvas>
        </figure>
        <figure class="plot">
          <figcaption>
            Estimate at the drop peg
            <span class="key"><i class="dot mc"></i>MC</span>
            <span class="key"><i class="dot td"></i>TD</span>
            <span class="key"><i class="dash"></i>true</span>
          </figcaption>
          <canvas id="pDrop" role="img" aria-label="Value estimate at the drop peg over balls"></canvas>
        </figure>
      </div>

      <div class="bar">
        <button id="play" class="primary">Pause</button>
        <button id="step">Step</button>
        <button id="resetLearn">Reset learning</button>
        <button id="defaults">Default parameters</button>
      </div>
      <div class="bar">
        <span class="lbl">Payoffs:</span>
        <button data-pay="jackpot">Jackpot</button>
        <button data-pay="linear">Linear</button>
        <button data-pay="edges">Edges</button>
        <button data-pay="random">Random</button>
      </div>
      <div class="bar">
        <span class="lbl">Pegs:</span>
        <button id="fair">All fair</button>
        <button id="biasRand">Random bias</button>
        <button id="dropTop">Drop from the top</button>
      </div>

      <div class="grid">
        <label class="slider"
          >Learning rate α <span class="val" id="vA"></span>
          <input id="sA" type="range" min="0.01" max="1" step="0.01"
        /></label>
        <label class="slider"
          >Initial estimate V₀ <span class="val" id="vI"></span>
          <input id="sI" type="range" min="0" max="10" step="0.5"
        /></label>
        <label class="slider"
          >Rows <span class="val" id="vR"></span>
          <input id="sR" type="range" min="3" max="14" step="1"
        /></label>
        <label class="slider"
          >Speed <span class="val" id="vV"></span>
          <input id="sV" type="range" min="0" max="3.7" step="0.01"
        /></label>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="cAvg" /> α = 1/n (sample average)</label>
        <label><input type="checkbox" id="cErr" /> Color pegs by error</label>
        <label><input type="checkbox" id="cFlash" checked /> Highlight updates</label>
        <label><input type="checkbox" id="cPath" checked /> Show ball path</label>
      </div>
    </div>

    <script>
      "use strict"

      // ---------------------------------------------------------------------
      // Board: rows of pegs, peg (r, k) with k = 0..r; from (r, k) the ball falls to
      // (r+1, k) on the left or (r+1, k+1) on the right; below row R-1 are R+1 slots
      // ---------------------------------------------------------------------
      const DEFAULTS = { alpha: 0.1, v0: 0, rows: 10, speed: 1.6 }
      const P = { ...DEFAULTS }
      const opt = { avg: false, err: false, flash: true, path: true }
      const PAY_MAX = 10

      let R = P.rows
      let NP = 0 // number of pegs
      let pLeft = [] // probability of bouncing left, per peg
      let payoff = [] // per slot
      let payPreset = "jackpot"
      let drop = 0 // peg the ball is dropped onto
      const pid = (r, k) => (r * (r + 1)) / 2 + k
      const rowOf = []
      const colOf = []

      function buildBoard(rows) {
        R = rows
        NP = (R * (R + 1)) / 2
        rowOf.length = colOf.length = 0
        for (let r = 0; r < R; r++)
          for (let k = 0; k <= r; k++) {
            rowOf.push(r)
            colOf.push(k)
          }
        pLeft = new Array(NP).fill(0.5)
        drop = 0
        setPayoffs(payPreset)
      }

      function setPayoffs(name) {
        payPreset = name
        const n = R + 1
        payoff = new Array(n).fill(0)
        const c = R / 2
        for (let i = 0; i < n; i++) {
          if (name === "jackpot") payoff[i] = i === Math.floor(R * 0.25) ? PAY_MAX : 1
          else if (name === "linear") payoff[i] = (PAY_MAX * i) / R
          else if (name === "edges") payoff[i] = Math.round(((PAY_MAX * Math.abs(i - c)) / c) * 2) / 2
          else payoff[i] = Math.round(Math.random() * 2 * PAY_MAX) / 2
        }
      }

      // exact values: V(peg) = expected payoff, by a backward pass
      let Vtrue = new Float64Array(0)
      let reach = new Float64Array(0) // probability of visiting each peg from the drop peg
      function computeTruth() {
        Vtrue = new Float64Array(NP)
        for (let r = R - 1; r >= 0; r--)
          for (let k = 0; k <= r; k++) {
            const s = pid(r, k),
              p = pLeft[s]
            const L = r === R - 1 ? payoff[k] : Vtrue[pid(r + 1, k)]
            const Rt = r === R - 1 ? payoff[k + 1] : Vtrue[pid(r + 1, k + 1)]
            Vtrue[s] = p * L + (1 - p) * Rt
          }
        reach = new Float64Array(NP)
        reach[drop] = 1
        for (let r = rowOf[drop]; r < R - 1; r++)
          for (let k = 0; k <= r; k++) {
            const s = pid(r, k)
            if (!reach[s]) continue
            reach[pid(r + 1, k)] += reach[s] * pLeft[s]
            reach[pid(r + 1, k + 1)] += reach[s] * (1 - pLeft[s])
          }
      }

      // ---------------------------------------------------------------------
      // Learners: both see exactly the same balls
      // ---------------------------------------------------------------------
      function makeSeries() {
        return { pts: [], stride: 1, n: 0 }
      }
      function pushSeries(sr, p) {
        if (sr.n++ % sr.stride !== 0) return
        sr.pts.push(p)
        if (sr.pts.length > 2000) {
          sr.pts = sr.pts.filter((_, i) => i % 2 === 0)
          sr.stride *= 2
        }
      }

      class Learner {
        constructor(kind) {
          this.kind = kind
          this.reset()
        }
        reset() {
          this.V = new Float64Array(NP).fill(P.v0)
          this.n = new Uint32Array(NP)
          this.flash = new Float32Array(NP)
          this.err = makeSeries()
          this.est = makeSeries()
          this.last = null
        }
        rate(s) {
          return opt.avg ? 1 / this.n[s] : P.alpha
        }
        update(s, target) {
          this.n[s]++
          this.V[s] += this.rate(s) * (target - this.V[s])
          this.flash[s] = 1
        }
        // RMS error weighted by how likely a ball from the drop peg visits each peg
        rmsError() {
          let sum = 0,
            w = 0
          for (let s = 0; s < NP; s++)
            if (reach[s] > 0) {
              const d = this.V[s] - Vtrue[s]
              sum += reach[s] * d * d
              w += reach[s]
            }
          return w ? Math.sqrt(sum / w) : 0
        }
      }
      let mc, td, learners

      // the ball
      const ball = { path: [], slot: -1, landed: false, count: 0, prevPos: null }

      function newBall() {
        ball.path = [drop]
        ball.slot = -1
        ball.landed = false
        ball.pending = false
      }

      // one tick = the ball falls one row (or a new ball is released after landing)
      function tick() {
        if (ball.landed) {
          newBall()
          return
        }
        const s = ball.path[ball.path.length - 1]
        const r = rowOf[s],
          k = colOf[s]
        const right = Math.random() >= pLeft[s] ? 1 : 0
        if (r === R - 1) {
          const slot = k + right
          const G = payoff[slot]
          ball.slot = slot
          ball.landed = true
          ball.count++
          // TD: the last peg's target is the payoff itself
          td.update(s, G)
          td.last = { s, target: G, terminal: true }
          // MC: every peg on the path moves towards the payoff it led to
          for (const q of ball.path) mc.update(q, G)
          mc.last = { G, count: ball.path.length, slot }
          for (const L of learners) {
            pushSeries(L.err, { x: ball.count, y: L.rmsError() })
            pushSeries(L.est, { x: ball.count, y: L.V[drop] })
          }
        } else {
          const s2 = pid(r + 1, k + right)
          const target = td.V[s2]
          td.update(s, target)
          td.last = { s, target, terminal: false }
          ball.path.push(s2)
        }
      }

      function resetLearning() {
        mc = new Learner("mc")
        td = new Learner("td")
        learners = [mc, td]
        ball.count = 0
        newBall()
      }

      function boardChanged() {
        computeTruth()
      }

      // ---------------------------------------------------------------------
      // Theme: follow the Quartz site colors when embedded
      // ---------------------------------------------------------------------
      const COLORS = {}
      function readColors() {
        let src = document.documentElement
        try {
          if (window.parent !== window && window.parent.document) {
            const pr = window.parent.document.documentElement
            const theme = pr.getAttribute("saved-theme")
            if (theme) document.documentElement.setAttribute("data-theme", theme)
            const pcs = getComputedStyle(pr)
            if (pcs.getPropertyValue("--secondary").trim()) src = pr
          }
        } catch (e) {
          /* cross-origin or standalone */
        }
        const cs = getComputedStyle(src)
        const own = getComputedStyle(document.documentElement)
        for (const n of [
          "light",
          "lightgray",
          "gray",
          "darkgray",
          "dark",
          "secondary",
          "tertiary",
        ]) {
          const v = cs.getPropertyValue("--" + n).trim() || own.getPropertyValue("--" + n).trim()
          COLORS[n] = v
          document.documentElement.style.setProperty("--" + n, v)
        }
        for (const n of ["danger", "mc", "flash"]) COLORS[n] = own.getPropertyValue("--" + n).trim()
        draw()
      }

      function watchTheme() {
        try {
          if (window.parent !== window) {
            new MutationObserver(readColors).observe(window.parent.document.documentElement, {
              attributes: true,
              attributeFilter: ["saved-theme", "class", "style"],
            })
          }
        } catch (e) {}
        if (window.matchMedia)
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors)
      }

      const probeCtx = document.createElement("canvas").getContext("2d")
      function withAlpha(color, a) {
        const ctx = probeCtx
        ctx.fillStyle = "#000"
        ctx.fillStyle = color
        const c = ctx.fillStyle
        if (c[0] === "#") {
          const r = parseInt(c.slice(1, 3), 16),
            g = parseInt(c.slice(3, 5), 16),
            b = parseInt(c.slice(5, 7), 16)
          return `rgba(${r},${g},${b},${a})`
        }
        const m = c.match(/[\d.]+/g)
        return m ? `rgba(${m[0]},${m[1]},${m[2]},${a})` : color
      }

      // ---------------------------------------------------------------------
      // Board geometry and rendering
      // ---------------------------------------------------------------------
      const panels = [
        { L: () => mc, cv: document.getElementById("cvMC"), st: document.getElementById("stMC") },
        { L: () => td, cv: document.getElementById("cvTD"), st: document.getElementById("stTD") },
      ]
      for (const p of panels) p.ctx = p.cv.getContext("2d")
      let hoverPeg = -1,
        hoverSlot = -1
      let frac = 1 // progress of the current fall, for smooth motion at low speeds

      // layout in CSS px for a canvas of width w
      function geom(w) {
        const dx = w / (R + 1)
        const dy = dx * 0.78
        const top = dx * 0.75
        const pegR = Math.min(dx * 0.3, 15)
        const slotTop = top + (R - 1) * dy + dx * 0.55
        const slotH = Math.max(56, dx * 2.1)
        return { dx, dy, top, pegR, slotTop, slotH, h: slotTop + slotH + 6 }
      }
      const pegX = (g, w, s) => w / 2 + (colOf[s] - rowOf[s] / 2) * g.dx
      const pegY = (g, s) => g.top + rowOf[s] * g.dy
      const slotX = (g, i) => (i + 0.5) * g.dx

      function resize() {
        const dpr = window.devicePixelRatio || 1
        for (const p of panels) {
          const w = p.cv.parentElement.clientWidth
          const g = geom(w)
          p.cv.width = Math.round(w * dpr)
          p.cv.height = Math.round(g.h * dpr)
          p.cv.style.height = g.h + "px"
          p.ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          p.w = w
          p.g = g
        }
        draw()
        fitFrame()
      }

      // sequential color for a value in [0, PAY_MAX]
      function valueFill(v) {
        const t = Math.min(1, Math.max(0, v / PAY_MAX))
        return withAlpha(COLORS.secondary, 0.08 + 0.85 * t)
      }

      // current ball position (interpolated along a little bounce arc)
      function ballPos(g, w) {
        const path = ball.path
        const s = path[path.length - 1]
        let x1 = pegX(g, w, s),
          y1 = pegY(g, s) - g.pegR * 1.6
        if (ball.landed) {
          x1 = slotX(g, ball.slot)
          y1 = g.slotTop + g.dx * 0.25
        }
        const prev = ball.landed ? s : path.length > 1 ? path[path.length - 2] : null
        if (prev === null || frac >= 1) return [x1, y1]
        const x0 = pegX(g, w, prev),
          y0 = pegY(g, prev) - g.pegR * 1.6
        const e = frac
        const x = x0 + (x1 - x0) * e
        const y = y0 + (y1 - y0) * e * e - Math.sin(Math.PI * e) * g.dy * 0.35
        return [x, y]
      }

      function drawPanel(p) {
        const { ctx, w, g } = p
        if (!w) return
        const L = p.L()
        ctx.clearRect(0, 0, w, g.h)
        ctx.fillStyle = COLORS.light
        ctx.fillRect(0, 0, w, g.h)

        // ball path
        if (opt.path && ball.path.length) {
          const path = ball.path
          ctx.strokeStyle = withAlpha(COLORS.dark, 0.35)
          ctx.lineWidth = 2
          ctx.lineJoin = "round"
          if (L.kind === "mc" && !ball.landed) ctx.setLineDash([5, 4])
          ctx.beginPath()
          for (let i = 0; i < path.length; i++) {
            const x = pegX(g, w, path[i]),
              y = pegY(g, path[i])
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
          }
          if (ball.landed) ctx.lineTo(slotX(g, ball.slot), g.slotTop + g.dx * 0.25)
          ctx.stroke()
          ctx.setLineDash([])
        }

        // pegs
        for (let s = 0; s < NP; s++) {
          const x = pegX(g, w, s),
            y = pegY(g, s)
          const reachable = reach[s] > 0
          if (opt.err) {
            const e = Math.min(1, Math.abs(L.V[s] - Vtrue[s]) / (PAY_MAX * 0.4))
            ctx.fillStyle = withAlpha(COLORS.danger, 0.06 + 0.85 * e)
          } else ctx.fillStyle = valueFill(L.V[s])
          ctx.globalAlpha = reachable ? 1 : 0.35
          ctx.beginPath()
          ctx.arc(x, y, g.pegR, 0, 2 * Math.PI)
          ctx.fill()
          ctx.strokeStyle = withAlpha(COLORS.darkgray, 0.55)
          ctx.lineWidth = 1
          ctx.stroke()
          ctx.globalAlpha = 1

          // bias: a little arrow towards the favored side
          const b = 0.5 - pLeft[s]
          if (Math.abs(b) > 0.01) {
            const len = Math.abs(b) * 2 * g.dx * 0.42
            const dir = Math.sign(b)
            const yy = y + g.pegR + 4
            ctx.strokeStyle = COLORS.dark
            ctx.lineWidth = 1.6
            ctx.beginPath()
            ctx.moveTo(x, yy)
            ctx.lineTo(x + dir * len, yy)
            ctx.lineTo(x + dir * (len - 3), yy - 3)
            ctx.moveTo(x + dir * len, yy)
            ctx.lineTo(x + dir * (len - 3), yy + 3)
            ctx.stroke()
          }

          if (opt.flash && L.flash[s] > 0.03) {
            ctx.strokeStyle = withAlpha(COLORS.flash, Math.min(1, 1.2 * L.flash[s]))
            ctx.lineWidth = 3
            ctx.beginPath()
            ctx.arc(x, y, g.pegR + 2.5, 0, 2 * Math.PI)
            ctx.stroke()
          }
          if (s === drop) {
            ctx.strokeStyle = COLORS.dark
            ctx.lineWidth = 1.5
            ctx.setLineDash([3, 3])
            ctx.beginPath()
            ctx.arc(x, y, g.pegR + 5, 0, 2 * Math.PI)
            ctx.stroke()
            ctx.setLineDash([])
          }
          if (s === hoverPeg) {
            ctx.strokeStyle = COLORS.dark
            ctx.lineWidth = 2
            ctx.beginPath()
            ctx.arc(x, y, g.pegR + 1, 0, 2 * Math.PI)
            ctx.stroke()
          }
        }

        // slots and payoff bars
        const base = g.slotTop + g.slotH - 14
        const barH = g.slotH - 30
        ctx.strokeStyle = COLORS.lightgray
        ctx.lineWidth = 1
        ctx.beginPath()
        for (let i = 0; i <= R + 1; i++) {
          const x = Math.round(i * g.dx) + 0.5
          ctx.moveTo(x, g.slotTop)
          ctx.lineTo(x, g.slotTop + g.slotH)
        }
        ctx.moveTo(0, Math.round(base) + 0.5)
        ctx.lineTo(w, Math.round(base) + 0.5)
        ctx.stroke()
        ctx.font = `${Math.max(9, Math.min(12, g.dx * 0.36))}px "IBM Plex Mono", ui-monospace, monospace`
        ctx.textAlign = "center"
        for (let i = 0; i <= R; i++) {
          const x0 = i * g.dx + g.dx * 0.18
          const bw = g.dx * 0.64
          const hh = (payoff[i] / PAY_MAX) * barH
          ctx.fillStyle = ball.landed && ball.slot === i ? COLORS.flash : withAlpha(COLORS.dark, 0.55)
          if (i === hoverSlot) ctx.fillStyle = COLORS.dark
          ctx.fillRect(x0, base - hh, bw, hh)
          ctx.fillStyle = COLORS.darkgray
          ctx.textBaseline = "top"
          ctx.fillText(fmtN(payoff[i]), slotX(g, i), base + 2)
        }

        // the ball
        const [bx, by] = ballPos(g, w)
        ctx.fillStyle = L.kind === "mc" ? COLORS.mc : COLORS.secondary
        ctx.strokeStyle = COLORS.light
        ctx.lineWidth = 2
        ctx.beginPath()
        ctx.arc(bx, by, Math.max(4, g.pegR * 0.62), 0, 2 * Math.PI)
        ctx.fill()
        ctx.stroke()
      }

      const fmt = (v, d = 2) =>
        v === null || v === undefined ? "–" : v.toFixed(d).replace("-", "−")
      const fmtN = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1))
      const pegName = (s) => `(${rowOf[s]},${colOf[s]})`

      function updateStatus() {
        const head = `ball ${ball.count + (ball.landed ? 0 : 1)} · `
        if (ball.landed && mc.last)
          panels[0].st.innerHTML =
            head +
            `landed in slot ${mc.last.slot}<br><b>moved all ${mc.last.count} pegs on the path towards G = ${fmtN(mc.last.G)}</b>`
        else
          panels[0].st.innerHTML =
            head +
            `falling<br><b>${ball.path.length} pegs waiting for the payoff</b>`
        const t = td.last
        panels[1].st.innerHTML =
          head +
          (ball.landed ? "landed" : "falling") +
          "<br>" +
          (t
            ? `<b>moved peg ${pegName(t.s)} towards ${t.terminal ? "payoff" : "V(next)"} = ${fmt(t.target)}</b>`
            : "<b>no updates yet</b>")
      }

      const readout = document.getElementById("readout")
      function updateReadout() {
        if (hoverSlot >= 0) {
          readout.textContent = `slot ${hoverSlot} · payoff ${fmtN(payoff[hoverSlot])} · drag up or down to change it`
          return
        }
        if (hoverPeg < 0) {
          readout.textContent =
            "Click a peg to drop balls there · drag a peg sideways to bias it · drag the payoff bars."
          return
        }
        const s = hoverPeg
        readout.textContent =
          `peg ${pegName(s)} · P(left) ${pLeft[s].toFixed(2)} · true V ${fmt(Vtrue[s])} · ` +
          `MC ${fmt(mc.V[s])} · TD ${fmt(td.V[s])} · ${mc.n[s]} visits`
      }

      // ---------------------------------------------------------------------
      // Plots
      // ---------------------------------------------------------------------
      const plots = {
        err: { cv: document.getElementById("pErr") },
        drop: { cv: document.getElementById("pDrop") },
      }
      for (const k in plots) plots[k].ctx = plots[k].cv.getContext("2d")

      function resizePlots() {
        const dpr = window.devicePixelRatio || 1
        for (const k in plots) {
          const p = plots[k]
          const w = p.cv.clientWidth,
            h = p.cv.clientHeight
          p.cv.width = Math.round(w * dpr)
          p.cv.height = Math.round(h * dpr)
          p.ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          p.w = w
          p.h = h
        }
      }

      function niceStep(span, n) {
        const raw = span / n
        const mag = Math.pow(10, Math.floor(Math.log10(raw)))
        const f = raw / mag
        return (f >= 5 ? 10 : f >= 2 ? 5 : f >= 1.5 ? 2 : 1) * mag
      }
      function tickLabel(v) {
        const a = Math.abs(v)
        let s
        if (a >= 1e6) s = +(v / 1e6).toFixed(1) + "M"
        else if (a >= 1e3) s = +(v / 1e3).toFixed(1) + "k"
        else s = +v.toFixed(2) + ""
        return s.replace("-", "−")
      }

      function drawPlot(p, series, { yMin, yMax, ref }) {
        const { ctx, w, h } = p
        if (!w) return
        ctx.clearRect(0, 0, w, h)
        const Lm = 40,
          Rm = 8,
          T = 6,
          B = 20
        let xMax = 10
        for (const sr of series) for (const q of sr.pts) xMax = Math.max(xMax, q.x)
        let lo = yMin,
          hi = yMax
        for (const sr of series)
          for (const q of sr.pts) {
            if (lo === undefined || q.y < lo) lo = q.y
            if (hi === undefined || q.y > hi) hi = q.y
          }
        if (ref !== undefined) {
          lo = Math.min(lo ?? ref, ref)
          hi = Math.max(hi ?? ref, ref)
        }
        if (lo === undefined) lo = 0
        if (hi === undefined) hi = 1
        if (hi - lo < 1e-6) hi = lo + 1
        const X = (x) => Lm + (x / xMax) * (w - Lm - Rm)
        const Y = (y) => T + (1 - (y - lo) / (hi - lo)) * (h - T - B)

        ctx.font = '10.5px "IBM Plex Mono", ui-monospace, monospace'
        ctx.fillStyle = COLORS.gray
        ctx.strokeStyle = COLORS.lightgray
        ctx.lineWidth = 1
        ctx.textAlign = "right"
        ctx.textBaseline = "middle"
        const ys = niceStep(hi - lo, 4)
        for (let v = Math.ceil(lo / ys) * ys; v <= hi + 1e-9; v += ys) {
          const y = Math.round(Y(v)) + 0.5
          ctx.beginPath()
          ctx.moveTo(Lm, y)
          ctx.lineTo(w - Rm, y)
          ctx.stroke()
          ctx.fillText(tickLabel(v), Lm - 5, y)
        }
        ctx.textAlign = "center"
        ctx.textBaseline = "top"
        const xs = niceStep(xMax, Math.max(2, Math.floor((w - Lm) / 70)))
        for (let v = 0; v <= xMax + 1e-9; v += xs) ctx.fillText(tickLabel(v), X(v), h - B + 5)
        ctx.textAlign = "right"
        ctx.textBaseline = "bottom"
        ctx.fillText("balls", w - Rm, h - B - 2)

        ctx.save()
        ctx.beginPath()
        ctx.rect(Lm, T - 2, w - Lm - Rm, h - T - B + 4)
        ctx.clip()
        if (ref !== undefined) {
          ctx.strokeStyle = COLORS.darkgray
          ctx.lineWidth = 1.5
          ctx.setLineDash([5, 4])
          ctx.beginPath()
          ctx.moveTo(Lm, Y(ref))
          ctx.lineTo(w - Rm, Y(ref))
          ctx.stroke()
          ctx.setLineDash([])
        }
        for (const sr of series) {
          if (sr.pts.length < 2) continue
          ctx.strokeStyle = sr.color
          ctx.lineWidth = 1.8
          ctx.lineJoin = "round"
          ctx.beginPath()
          sr.pts.forEach((q, i) => (i ? ctx.lineTo(X(q.x), Y(q.y)) : ctx.moveTo(X(q.x), Y(q.y))))
          ctx.stroke()
        }
        ctx.restore()
        if (!series.some((sr) => sr.pts.length)) {
          ctx.fillStyle = COLORS.gray
          ctx.textAlign = "center"
          ctx.textBaseline = "middle"
          ctx.font = '12px "Source Sans Pro", system-ui, sans-serif'
          ctx.fillText("waiting for the first ball…", (Lm + w - Rm) / 2, (T + h - B) / 2)
        }
      }

      function drawPlots() {
        drawPlot(
          plots.err,
          [
            { pts: mc.err.pts, color: COLORS.mc },
            { pts: td.err.pts, color: COLORS.secondary },
          ],
          { yMin: 0 },
        )
        drawPlot(
          plots.drop,
          [
            { pts: mc.est.pts, color: COLORS.mc },
            { pts: td.est.pts, color: COLORS.secondary },
          ],
          { ref: Vtrue[drop] },
        )
      }

      function draw() {
        if (!COLORS.light || !mc) return
        for (const p of panels) drawPanel(p)
        drawPlots()
        updateStatus()
      }

      // ---------------------------------------------------------------------
      // Interaction: click a peg = drop point, drag a peg sideways = bias,
      // double-click = fair, drag a payoff bar = payoff
      // ---------------------------------------------------------------------
      function hitTest(p, ev) {
        const r = p.cv.getBoundingClientRect()
        const x = ev.clientX - r.left,
          y = ev.clientY - r.top
        const g = p.g
        if (y >= g.slotTop) {
          const i = Math.floor(x / g.dx)
          return { slot: i >= 0 && i <= R ? i : -1, peg: -1, x, y }
        }
        let best = -1,
          bd = Infinity
        for (let s = 0; s < NP; s++) {
          const d = Math.hypot(x - pegX(g, p.w, s), y - pegY(g, s))
          if (d < bd) {
            bd = d
            best = s
          }
        }
        return { peg: bd <= Math.max(g.pegR * 1.4, 12) ? best : -1, slot: -1, x, y }
      }

      let drag = null
      function payoffFromY(p, y) {
        const g = p.g
        const base = g.slotTop + g.slotH - 14
        const barH = g.slotH - 30
        const v = ((base - y) / barH) * PAY_MAX
        return Math.min(PAY_MAX, Math.max(0, Math.round(v * 2) / 2))
      }

      for (const p of panels) {
        p.cv.addEventListener("pointerdown", (ev) => {
          const h = hitTest(p, ev)
          if (h.slot >= 0) {
            drag = { kind: "slot", slot: h.slot, p }
            payoff[h.slot] = payoffFromY(p, h.y)
            boardChanged()
          } else if (h.peg >= 0) {
            drag = { kind: "peg", peg: h.peg, x0: h.x, p0: pLeft[h.peg], moved: false, p }
          } else return
          ev.preventDefault()
          p.cv.setPointerCapture(ev.pointerId)
          draw()
        })
        p.cv.addEventListener("pointermove", (ev) => {
          const h = hitTest(p, ev)
          if (drag && drag.kind === "slot") {
            const v = payoffFromY(drag.p, h.y)
            if (v !== payoff[drag.slot]) {
              payoff[drag.slot] = v
              boardChanged()
            }
          } else if (drag && drag.kind === "peg") {
            const d = h.x - drag.x0
            if (Math.abs(d) > 4) drag.moved = true
            if (drag.moved) {
              const v = Math.min(0.98, Math.max(0.02, drag.p0 - d / (p.g.dx * 2)))
              pLeft[drag.peg] = Math.round(v * 50) / 50
              boardChanged()
            }
          } else {
            hoverPeg = h.peg
            hoverSlot = h.slot
          }
          updateReadout()
        })
        const end = () => {
          if (drag && drag.kind === "peg" && !drag.moved && drag.peg !== drop) {
            drop = drag.peg
            boardChanged()
            newBall()
          }
          drag = null
        }
        p.cv.addEventListener("pointerup", end)
        p.cv.addEventListener("pointercancel", () => (drag = null))
        p.cv.addEventListener("pointerleave", () => {
          if (drag) return
          hoverPeg = hoverSlot = -1
          updateReadout()
        })
        p.cv.addEventListener("dblclick", (ev) => {
          const h = hitTest(p, ev)
          if (h.peg >= 0) {
            pLeft[h.peg] = 0.5
            boardChanged()
          }
        })
      }

      // ---------------------------------------------------------------------
      // Controls
      // ---------------------------------------------------------------------
      let running = true
      const sliders = [
        ["sA", "vA", "alpha", (v) => v.toFixed(2)],
        ["sI", "vI", "v0", (v) => v.toFixed(1)],
        ["sR", "vR", "rows", (v) => String(v)],
        ["sV", "vV", "speed", (v) => fmtSpeed(Math.pow(10, v))],
      ]
      function fmtSpeed(sps) {
        const bps = sps / R
        return `${Math.round(sps)} rows/s ≈ ${bps < 10 ? bps.toFixed(1) : Math.round(bps)} balls/s`
      }
      function syncSliders() {
        for (const [sid, vid, key, f] of sliders) {
          document.getElementById(sid).value = P[key]
          document.getElementById(vid).textContent = f(P[key])
        }
        document.getElementById("sA").disabled = opt.avg
      }
      for (const [sid, vid, key, f] of sliders) {
        document.getElementById(sid).addEventListener("input", (e) => {
          P[key] = parseFloat(e.target.value)
          document.getElementById(vid).textContent = f(P[key])
          if (key === "rows") {
            hoverPeg = hoverSlot = -1
            buildBoard(P.rows)
            computeTruth()
            resetLearning()
            resize()
            syncSliders()
          } else if (key === "v0") {
            resetLearning()
          }
        })
      }

      function setRunning(r) {
        running = r
        if (!r) frac = 1
        document.getElementById("play").textContent = r ? "Pause" : "Play"
      }
      document.getElementById("play").addEventListener("click", () => setRunning(!running))
      document.getElementById("step").addEventListener("click", () => {
        setRunning(false)
        tick()
        draw()
      })
      document.getElementById("resetLearn").addEventListener("click", () => {
        resetLearning()
        draw()
      })
      document.getElementById("defaults").addEventListener("click", () => {
        const rowsChanged = P.rows !== DEFAULTS.rows
        Object.assign(P, DEFAULTS)
        opt.avg = false
        document.getElementById("cAvg").checked = false
        if (rowsChanged) {
          buildBoard(P.rows)
          computeTruth()
          resize()
        }
        resetLearning()
        syncSliders()
      })
      document.querySelectorAll("[data-pay]").forEach((b) =>
        b.addEventListener("click", () => {
          setPayoffs(b.dataset.pay)
          boardChanged()
        }),
      )
      document.getElementById("fair").addEventListener("click", () => {
        pLeft.fill(0.5)
        boardChanged()
      })
      document.getElementById("biasRand").addEventListener("click", () => {
        for (let s = 0; s < NP; s++) pLeft[s] = Math.round((0.15 + 0.7 * Math.random()) * 50) / 50
        boardChanged()
      })
      document.getElementById("dropTop").addEventListener("click", () => {
        drop = 0
        boardChanged()
        newBall()
      })
      for (const [id, key] of [
        ["cAvg", "avg"],
        ["cErr", "err"],
        ["cFlash", "flash"],
        ["cPath", "path"],
      ]) {
        document.getElementById(id).addEventListener("change", (e) => {
          opt[key] = e.target.checked
          if (key === "avg") syncSliders()
          draw()
        })
      }

      // ---------------------------------------------------------------------
      // Embedding: size the parent iframe to fit the content
      // ---------------------------------------------------------------------
      function fitFrame() {
        try {
          const fe = window.frameElement
          const h = Math.ceil(document.getElementById("wrap").getBoundingClientRect().height)
          const px = h + 4 + "px"
          // only write when it changes, so the observer below does not trigger itself
          if (fe && fe.style.height !== px) fe.style.height = px
        } catch (e) {}
      }

      // ---------------------------------------------------------------------
      // Main loop
      // ---------------------------------------------------------------------
      let last = performance.now(),
        acc = 0
      function frame(now) {
        const dt = Math.min(0.1, (now - last) / 1000)
        last = now
        const sps = Math.pow(10, P.speed)
        if (running) {
          acc += dt * sps
          let n = Math.floor(acc)
          acc -= n
          n = Math.min(n, 20000)
          for (let i = 0; i < n; i++) tick()
          frac = sps <= 45 ? acc : 1
        }
        const tau = Math.max(0.08, Math.min(0.5, 6 / sps)) // fade faster at higher speeds
        const decay = Math.exp(-dt / tau)
        for (const L of learners) for (let s = 0; s < NP; s++) L.flash[s] *= decay
        draw()
        requestAnimationFrame(frame)
      }

      buildBoard(P.rows)
      computeTruth()
      resetLearning()
      syncSliders()
      updateReadout()
      readColors()
      watchTheme()
      new ResizeObserver(resize).observe(document.querySelector(".panels"))
      new ResizeObserver(() => {
        resizePlots()
        draw()
      }).observe(document.querySelector(".plots"))
      resizePlots()
      new ResizeObserver(fitFrame).observe(document.getElementById("wrap"))
      // Quartz's SPA navigation (e.g. clicking the current page in the sidebar) patches the
      // parent page in place: the iframe is kept without reloading, but its inline height is reset
      // to the one in the markdown. Re-fit whenever the frame's style attribute changes.
      try {
        if (window.frameElement)
          new MutationObserver(fitFrame).observe(window.frameElement, { attributes: true, attributeFilter: ["style"] })
      } catch (e) {}
      resize()
      requestAnimationFrame(frame)
    </script>
  </body>
</html>
